# Builds the container images and pushes them to GitHub Container Registry,
# after the full checks (release-checks.yml) have passed on the commit.
# It runs only for a release: release.yml calls it when a v* tag is pushed.
# There is no manual run: the cluster's Flux follows version releases, so an
# image built outside a release would never be deployed (and a "latest" from
# one would mislead).
#   ghcr.io/<owner>/<repo>/<image>:sha-<commit>  every build
#   ghcr.io/<owner>/<repo>/<image>:last-build    every build; how the next one finds
#                                                 this image's last build
# The version tags (1.2.3, 1.2, latest) are not set here: release.yml adds
# them to these same digests after the release is approved, and signs them
# (docs/releases.md).
#
# Only images whose files changed are built. An image whose files (its paths
# below, .dockerignore, its matrix entry and the build step here) are the same as at its last build gets
# this run's tags on that same image (same digest), so a deploy pinned by
# digest does not restart it (scripts/image-reuse.sh, docs/release-guidelines.md).
# Set the repository variable HUBRA_BUILD_ALL=true to rebuild them all in the
# next release (remove it afterwards). A new build gets
# a build provenance attestation (who built it, from which commit and
# workflow), kept with the image on GHCR.
#
# All the images always carry every tag of the run, so one version names
# them all. The digest block at the end of the run summary is what a cluster's
# own repository pins.
#
# To deploy a change, release it (a patch version is enough): Flux picks up
# the new version.
#
# The backend comes as four images from one Dockerfile
# (docs/platform-backend.md, "Images"): backend holds every file (Compose),
# and app-backend, global-backend and platform-backend hold only the code
# their role imports (app/backend/scripts/role_files.py), with HUBRA_ROLE set.
# A role image is rebuilt only when one of the files on its list changed, so
# a platform-only change leaves the app and global images (and their pods)
# as they were.
#
# The frontend images carry no host names; they are set at container start
# (app/deploy/nginx/40-hubra-runtime.sh), so one image fits every install.
name: Images

on:
  workflow_call:
    inputs:
      build_all:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  # Build provenance attestations (keyless, with the run's OIDC token).
  id-token: write
  attestations: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full checks (release-checks.yml) first: no image is published from a
  # commit that fails them.
  checks:
    uses: ./.github/workflows/release-checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # paths: what goes into the image; a change there means a new build.
          # role: a backend image with one role's files only; its paths are
          # that role's file list (scripts/role_files.py), added at run time.
          - image: backend
            context: .
            dockerfile: app/backend/Dockerfile
            target: backend
            paths: app/backend
          - image: app-backend
            context: .
            dockerfile: app/backend/Dockerfile
            target: role
            role: app
            paths: app/backend/Dockerfile app/backend/scripts/role_files.py
          - image: global-backend
            context: .
            dockerfile: app/backend/Dockerfile
            target: role
            role: global
            paths: app/backend/Dockerfile app/backend/scripts/role_files.py
          - image: platform-backend
            context: .
            dockerfile: app/backend/Dockerfile
            target: role
            role: platform
            paths: app/backend/Dockerfile app/backend/scripts/role_files.py
          - image: mcp
            context: .
            dockerfile: app/mcp/Dockerfile
            paths: app/mcp
          - image: frontend
            context: .
            dockerfile: app/frontend/Dockerfile
            target: production
            paths: app/frontend packages app/deploy/nginx
          - image: admin-frontend
            context: .
            dockerfile: app/admin-frontend/Dockerfile
            target: production
            paths: app/admin-frontend packages app/deploy/nginx
          - image: sso-frontend
            context: .
            dockerfile: app/sso-frontend/Dockerfile
            target: production
            paths: app/sso-frontend packages app/deploy/nginx
          - image: support-frontend
            context: .
            dockerfile: app/support-frontend/Dockerfile
            target: production
            paths: app/support-frontend packages app/deploy/nginx
          - image: haraka
            context: modules/mail/haraka
            dockerfile: modules/mail/haraka/Dockerfile
            paths: modules/mail/haraka
          - image: zonemta
            context: modules/mail/zonemta
            dockerfile: modules/mail/zonemta/Dockerfile
            paths: modules/mail/zonemta
          - image: cert-watcher
            context: modules/mail/cert-watcher
            dockerfile: modules/mail/cert-watcher/Dockerfile
            paths: modules/mail/cert-watcher
    steps:
      # Full history: the last build's commit may be anywhere in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # A release (a v* tag) gets only sha- and last-build here;
          # release.yml adds its version tags and latest after the approval.
          flavor: |
            latest=false
          tags: |
            type=sha,format=short
            type=raw,value=last-build

      # Build, or reuse the last build when none of this image's files changed.
      - name: Changed since the last build?
        id: plan
        env:
          BUILD_ALL: ${{ inputs.build_all || vars.HUBRA_BUILD_ALL == 'true' }}
          IMAGE: ${{ steps.name.outputs.image }}
          PATHS: ${{ matrix.paths }}
          ROLE: ${{ matrix.role }}
        run: |
          # shellcheck disable=SC2086 # PATHS is a space-separated list
          set -- $PATHS
          if [ -n "$ROLE" ]; then
            # The role's own files: a change elsewhere doesn't reach its image.
            mapfile -t files < <(python3 app/backend/scripts/role_files.py "$ROLE" --prefix app/backend/)
            set -- "$@" "${files[@]}"
            echo "$ROLE: ${#files[@]} files" >&2
          fi
          scripts/image-reuse.sh "$IMAGE" "$@" | tee -a "$GITHUB_OUTPUT"

      # Add linux/arm64 to platforms for Raspberry Pi / Ampere clusters
      # (slower: builds under QEMU).
      - id: build
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown in manage (Diagnose > Builds); the mail images ignore it.
          build-args: |
            GIT_SHA=${{ github.sha }}
            ROLE=${{ matrix.role }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Who built it, from which commit and workflow run: a signed (keyless)
      # SLSA provenance statement, stored next to the image on GHCR. A
      # reused image keeps the attestation of the run that built it.
      # Check with: gh attestation verify oci://<image>@<digest> --repo hubra-app/hubra
      - name: Attest build provenance
        if: steps.plan.outputs.build == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Same image, new tags: the registry copies the tags, nothing is pulled
      # or pushed and the digest stays. Its build commit (Diagnose > Builds)
      # stays the commit it was built from.
      - name: Reuse the last build
        if: steps.plan.outputs.build == 'false'
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.plan.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$REF"

      - name: Summary
        id: result
        env:
          IMAGE: ${{ matrix.image }}
          BUILT: ${{ steps.build.outputs.digest }}
          REUSED: ${{ steps.plan.outputs.digest }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          if [ -n "$BUILT" ]; then digest="$BUILT"; what="built"; else digest="$REUSED"; what="reused"; fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "**$IMAGE**: $what ($REASON), \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      # Fixable HIGH/CRITICAL CVEs go to the job summary, for reused images too
      # (new CVEs turn up in old images). Report only for now;
      # set TRIVY_EXIT_CODE=1 once the images are clean to fail the build.
      - name: Scan the image (Trivy)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.result.outputs.digest }}
          TRIVY_EXIT_CODE: "0"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code "$TRIVY_EXIT_CODE" --no-progress --format table "$REF" \
            | tee trivy.txt
          {
            echo "### ${{ matrix.image }}: fixable HIGH/CRITICAL vulnerabilities"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One images: block with every image of this run pinned by digest, for a
  # cluster's own repository. Unchanged images keep their
  # digest, so pinning this block restarts only what was rebuilt.
  digests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For a release, release.yml prints the same block with the version
      # tag once it is approved, and attaches it to the release.
      - name: Digest block
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "### Images pinned by digest"
            echo
            echo "For the \`images:\` block of a cluster's repository:"
            echo
            echo '```yaml'
            echo "images:"
            for image in backend app-backend global-backend platform-backend mcp frontend admin-frontend sso-frontend support-frontend haraka zonemta cert-watcher; do
              digest="$(docker buildx imagetools inspect "$repo/$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
              echo "  - name: $repo/$image"
              echo "    newTag: \"$tag\""
              echo "    digest: $digest"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
