# The full checks: everything in ci.yml (lint and every unit test, whatever
# the change touched), plus the backend tests on Postgres, the dependency
# audits, the production builds of the three frontends, and the Compose stack
# with the browser tests.
#
# Runs when a release/* branch is created or pushed to, on pull requests into
# a release/* branch, and from images.yml before a release's images are
# built, so no image is published from a commit that failed them. Run it by
# hand from Actions > Release checks > Run workflow, for example on main
# before cutting a release branch. docs/ci.md explains the release flow.
#
# Branch protection on release/* requires the check "release-checks".
name: Release checks

on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: ["release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # The backend tests again on Postgres, the database production runs. This
  # also runs the tests SQLite skips (club schemas, row and advisory locks,
  # the real pg_dump). One database per xdist worker (tests/xdist_postgres.py).
  backend-postgres:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hubra
          POSTGRES_PASSWORD: hubra
          POSTGRES_DB: hubra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hubra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app/backend
    env:
      TEST_DATABASE_URL: postgresql://hubra:hubra@localhost:5432/hubra_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps --require-hashes -r requirements.lock
      - run: pip install pytest pytest-flask pytest-xdist
      # age for the backup tests; the PostgreSQL 18 client for the pg_dump test.
      - name: age and pg_dump 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age postgresql-client-18
      - run: pytest -q -n auto -rs

  # Known vulnerabilities in the locked dependencies. Every step runs even
  # when an earlier one failed, so one run shows all findings.
  audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: backend
        if: ${{ !cancelled() }}
        run: pipx run pip-audit==2.10.0 -r app/backend/requirements.lock --no-deps --disable-pip
      # Runtime dependencies, high and critical.
      - name: frontend
        if: ${{ !cancelled() }}
        working-directory: app/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: admin-frontend
        if: ${{ !cancelled() }}
        working-directory: app/admin-frontend
        run: npm audit --omit=dev --audit-level=high
      - name: sso-frontend
        if: ${{ !cancelled() }}
        working-directory: app/sso-frontend
        run: npm audit --omit=dev --audit-level=high

  # Builds the images and runs the Compose stack end to end, with the
  # browser tests of the three apps against it. The image builds also cover
  # the production builds of the frontends, so they build without a cache.
  # The browser tests run like in ci.yml (browser-tests): three workers, each
  # with its own club and account.
  compose-smoke:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:.github/e2e/docker-compose.e2e.yml
      E2E_WORKERS: "3"
      E2E_APP_URL: http://localhost:8080
      E2E_MANAGE_URL: http://localhost:8081
      E2E_SSO_URL: http://localhost:8082
      E2E_CLUB: e2e
      E2E_EMAIL: e2e@hubra.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        # The e2e accounts are platform admins that sign in with a password
        # only, so the two-factor rule for staff is off for this stack.
        run: |
          scripts/init-env.sh
          echo "MFA_REQUIRED_FOR_STAFF=false" >> .env
          echo "STEP_UP_ENFORCED=false" >> .env
          password="E2e-Test-$(date +%s)!"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: docker compose build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Start the stack, install the test tools meanwhile
        run: |
          docker compose up -d --no-build > /tmp/compose-up.log 2>&1 &
          up=$!
          (cd app/frontend && npm ci && npx playwright install --with-deps --only-shell chromium)
          wait "$up" || { cat /tmp/compose-up.log; exit 1; }
          cat /tmp/compose-up.log
          scripts/smoke-test.sh
      # Browser tests of the three apps against the same stack (app/frontend/e2e).
      - name: Clubs and accounts for the browser tests
        run: scripts/e2e-accounts.sh
      - name: Browser tests
        working-directory: app/frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=200

  # The one check branch protection on release/* requires, and the one
  # images.yml waits for. Passes only when every job above passed.
  release-checks:
    needs: [ci, backend-postgres, audit, compose-smoke]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
