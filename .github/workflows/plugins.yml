# Publishes the plugins in plugins/ to the official marketplace,
# hubra-app/hubra-plugins, served on GitHub Pages at
#   https://hubra-app.github.io/hubra-plugins/index.json
# (keys/official/index.url points there).
#
# Only plugin versions that are not in the marketplace yet are built and
# signed, so a published version never changes. Bump `version` in a
# plugin's plugin.yaml (and add a CHANGELOG.md entry) to release it.
#
# Secrets in this repository:
#   HUBRA_SIGNING_KEY   the private key (PEM) of keys/official/Hubra.pub
#   PLUGINS_DEPLOY_KEY  private SSH key of a deploy key with write access
#                       on hubra-app/hubra-plugins
name: Plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "app/frontend/src/plugins/**"
      - "app/frontend/scripts/build-plugin.mjs"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the marketplace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hubra-app/hubra-plugins
          ssh-key: ${{ secrets.PLUGINS_DEPLOY_KEY }}
          path: public

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps -r app/backend/requirements.lock

      - name: Plugin versions not published yet
        id: new
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib, yaml
          index = pathlib.Path("public/index.json")
          published = set()
          if index.is_file():
              for p in json.loads(index.read_text()).get("plugins") or []:
                  for v in p.get("versions") or [p]:
                      published.add((p["id"], str(v["version"])))
          new = []
          for f in sorted(pathlib.Path("plugins").glob("*/plugin.yaml")):
              m = yaml.safe_load(f.read_text())
              if (str(m["id"]), str(m["version"])) not in published:
                  new.append(str(m["id"]))
          print("only=" + " ".join(f"--only {i}" for i in new))
          print("any=" + ("true" if new else "false"))
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.new.outputs.any == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Build the plugin frontends
        if: steps.new.outputs.any == 'true'
        working-directory: app/frontend
        run: |
          npm ci
          npm run build:plugin

      - name: Sign and publish
        if: steps.new.outputs.any == 'true'
        working-directory: app/backend
        env:
          FLASK_APP: "hubra:create_app()"
          SIGNING_KEY: ${{ secrets.HUBRA_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/hubra.pem"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$key"
          # Refuse to sign with any key but the official one.
          python - "$key" <<'EOF'
          import sys
          from cryptography.hazmat.primitives import serialization
          from hubra.core.plugins.trust import OFFICIAL_DIR, key_id, load_public
          pub = serialization.load_pem_private_key(open(sys.argv[1], "rb").read(), None).public_key()
          official = load_public((OFFICIAL_DIR / "Hubra.pub").read_text())
          if key_id(pub) != key_id(official):
              sys.exit(f"HUBRA_SIGNING_KEY is {key_id(pub)}, not the official key {key_id(official)}")
          EOF
          flask plugins repo ../../plugins ../../public --key "$key" \
            --name "Hubra official" --description "Plugins made by the Hubra project" \
            ${{ steps.new.outputs.only }}
          rm -f "$key"
          touch ../../public/.nojekyll

      - name: Push to the marketplace
        if: steps.new.outputs.any == 'true'
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${{ steps.new.outputs.only }} from hubra@${GITHUB_SHA::7}"
          git push
