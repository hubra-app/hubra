# Builds the official plugin marketplace from plugins/ and pushes it as the
# image ghcr.io/hubra-app/hubra/plugins (nginx with the signed index.json and
# the plugin archives). The Contabo cluster serves it at
#   https://plugins.hubra.club/index.json
# (keys/official/index.url points there; deploy/clusters/contabo/plugins.yaml).
# Tags: latest, sha-<commit> and main-<timestamp>-<commit>.
#
# The marketplace so far comes out of the latest image, and only plugin
# versions that are not in it yet are built and signed, so a published
# version never changes. Bump `version` in a plugin's plugin.yaml (and add a
# CHANGELOG.md entry) to release it.
#
# The signing key is the most sensitive secret here: anything it signs
# installs as "official" on every Hubra server. So the job that holds it runs
# no npm and no third-party action, only pinned Python packages, and nothing
# that runs before it (npm ci, the frontend build) ever sees the key.
#   build    no secrets: the marketplace so far, the plugin frontends
#   sign     environment "plugin-signing": signs the new versions
#   publish  packages: write, no signing key: pushes the image
#
# Secret, in the GitHub environment "plugin-signing" (Settings >
# Environments; add yourself as required reviewer so every signing run
# waits for a click):
#   HUBRA_SIGNING_KEY   the private key (PEM) of keys/official/Hubra.pub
name: Plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "app/frontend/src/plugins/**"
      - "app/frontend/scripts/build-plugin.mjs"
      - "app/deploy/plugins/**"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.new.outputs.any }}
      only: ${{ steps.new.outputs.only }}
      image: ${{ steps.name.outputs.image }}
      sha: ${{ steps.name.outputs.sha }}
      ts: ${{ steps.name.outputs.ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/plugins" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Sortable tag for Flux image automation, as in images.yml.
          echo "ts=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The marketplace so far
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          mkdir public
          if docker manifest inspect "$IMAGE:latest" > /dev/null 2>&1; then
            docker pull -q "$IMAGE:latest"
            id=$(docker create "$IMAGE:latest")
            docker cp "$id:/usr/share/nginx/html/." public/
            docker rm "$id"
            rm -f public/index.html public/50x.html
          else
            echo "No $IMAGE:latest yet; this is the first publish."
          fi
          ls -l public

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3

      - name: Plugin versions not published yet
        id: new
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, yaml
          index = pathlib.Path("public/index.json")
          published = set()
          if index.is_file():
              for p in json.loads(index.read_text()).get("plugins") or []:
                  for v in p.get("versions") or [p]:
                      published.add((p["id"], str(v["version"])))
          new = []
          for f in sorted(pathlib.Path("plugins").glob("*/plugin.yaml")):
              m = yaml.safe_load(f.read_text())
              if (str(m["id"]), str(m["version"])) not in published:
                  new.append(str(m["id"]))
          print("only=" + " ".join(f"--only {i}" for i in new))
          print("any=" + ("true" if new else "false"))
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.new.outputs.any == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Build the plugin frontends
        if: steps.new.outputs.any == 'true'
        working-directory: app/frontend
        run: |
          npm ci
          npm run build:plugin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned
          path: |
            plugins/
            public/
          include-hidden-files: true
          retention-days: 1

  sign:
    needs: build
    if: needs.build.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: plugin-signing
    steps:
      # Only the repository's own code and the locked Python packages run
      # while the key exists. Plugin sources come from git; from the build
      # job only the marketplace so far and the built frontends (dist/), so
      # what npm touched can't change the Python code that gets signed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            app/backend
            plugins
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Take the marketplace and the built frontends
        env:
          UNSIGNED: ${{ runner.temp }}/unsigned
        run: |
          mv "$UNSIGNED/public" public
          for dist in "$UNSIGNED"/plugins/*/frontend/dist; do
            [ -d "$dist" ] || continue
            id="$(basename "$(dirname "$(dirname "$dist")")")"
            [ -d "plugins/$id" ] || continue
            rm -rf "plugins/$id/frontend/dist"
            mkdir -p "plugins/$id/frontend"
            cp -R "$dist" "plugins/$id/frontend/dist"
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --no-deps -r app/backend/requirements.lock

      - name: Sign
        working-directory: app/backend
        env:
          FLASK_APP: "hubra:create_app()"
          SIGNING_KEY: ${{ secrets.HUBRA_SIGNING_KEY }}
          ONLY: ${{ needs.build.outputs.only }}
        run: |
          key="$RUNNER_TEMP/hubra.pem"
          trap 'rm -f "$key"' EXIT
          # Only the key file is private; the published files must stay readable.
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          # Refuse to sign with any key but the official one.
          python - "$key" <<'PY'
          import sys
          from cryptography.hazmat.primitives import serialization
          from hubra.core.plugins.trust import OFFICIAL_DIR, key_id, load_public
          pub = serialization.load_pem_private_key(open(sys.argv[1], "rb").read(), None).public_key()
          official = load_public((OFFICIAL_DIR / "Hubra.pub").read_text())
          if key_id(pub) != key_id(official):
              sys.exit(f"HUBRA_SIGNING_KEY is {key_id(pub)}, not the official key {key_id(official)}")
          PY
          # $ONLY is "--only <id> ..." built from plugin.yaml ids.
          # shellcheck disable=SC2086
          flask plugins repo ../../plugins ../../public --key "$key" \
            --name "Hubra official" --description "Plugins made by the Hubra project" \
            $ONLY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed
          path: public/
          retention-days: 1

  publish:
    needs: [build, sign]
    # Also on a manual run with nothing new: rebuild the image as it is.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' ||
       (needs.sign.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: app/deploy/plugins
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.sign.result == 'success'
        with:
          name: signed
          path: public/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.sign.result != 'success'
        with:
          name: unsigned
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: app/deploy/plugins/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.build.outputs.image }}:latest
            ${{ needs.build.outputs.image }}:sha-${{ needs.build.outputs.sha }}
            ${{ needs.build.outputs.image }}:main-${{ needs.build.outputs.ts }}-${{ needs.build.outputs.sha }}
