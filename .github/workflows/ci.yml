# Fast checks on pull requests into main and on pushes to main: lint and the
# unit tests. The slow checks (dependency audits, production builds, the
# Compose stack and the browser tests) run in release-checks.yml, on
# release/* branches and before a release's images are built. docs/ci.md
# explains the split and the branch protection rules that go with it.
#
# Branch protection requires two checks from this file: "lint" and "tests".
# Both always report, even for a docs-only change, so a required check is
# never left waiting. "tests" passes when the test jobs it waits for were
# skipped because the change did not touch their part of the code.
#
# Draft pull requests run nothing; the checks start when the PR is marked
# ready for review.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # release-checks.yml runs this file with full: true, which runs every job
  # whatever the change touched.
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.full && 'full' || 'fast' }}
  cancel-in-progress: true

jobs:
  # Which test jobs the change needs. Only these paths run tests:
  #   backend tests    app/backend/, plugins/, settings.yaml, ci.yml
  #   frontend tests   app/*frontend/, packages/, plugins/, ci.yml
  # Everything else (other workflows, deploy/, modules/, scripts/, docs)
  # runs lint only.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontends: ${{ steps.diff.outputs.frontends }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          FULL: ${{ inputs.full && 'true' || 'false' }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$FULL" = true ] || ! files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            # Full run, or unknown base (new branch, force push): run everything.
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontends=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qE '^(app/backend/|plugins/|settings\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(app/(frontend|admin-frontend|sso-frontend)/|packages/|plugins/|\.github/workflows/ci\.yml$)'; then
            echo "frontends=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontends=false" >> "$GITHUB_OUTPUT"
          fi

  # Every linter and type check, on every change. Required on main.
  # Every step runs even when an earlier one failed, so one run shows all
  # failures.
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/admin-frontend/package-lock.json
            app/sso-frontend/package-lock.json
      - name: "backend: ruff"
        if: ${{ !cancelled() }}
        working-directory: app/backend
        run: |
          pipx run ruff==0.15.17 check .
      - name: "frontend: eslint and tsc"
        if: ${{ !cancelled() }}
        working-directory: app/frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: "admin-frontend: eslint and tsc"
        if: ${{ !cancelled() }}
        working-directory: app/admin-frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: "sso-frontend: eslint and tsc"
        if: ${{ !cancelled() }}
        working-directory: app/sso-frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: Compose files
        if: ${{ !cancelled() }}
        run: |
          scripts/init-env.sh
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
          docker compose -f docker-compose.yml -f modules/mail/docker-compose.mail.yml config -q
      - name: Kustomize and kubeconform
        if: ${{ !cancelled() }}
        run: |
          set -e
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform

          for dir in deploy/app deploy/vollbuild-ch deploy/clusters/contabo modules/mail/k8s; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone "$dir" > "/tmp/$(basename "$dir").yaml"
          done
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/app.yaml /tmp/vollbuild-ch.yaml /tmp/contabo.yaml /tmp/k8s.yaml
      - name: Shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck deploy/create-secrets.sh scripts/init-env.sh scripts/smoke-test.sh app/deploy/nginx/40-hubra-runtime.sh

  # Backend unit tests on in-memory SQLite (TestingConfig); no services needed.
  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps -r requirements.lock
      - run: pip install pytest pytest-flask
      - run: pytest -q

  # Frontend unit tests (vitest in the club app, node --test in SSO).
  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontends == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/sso-frontend/package-lock.json
      - name: "frontend"
        if: ${{ !cancelled() }}
        working-directory: app/frontend
        run: |
          npm ci
          npm test
      - name: "sso-frontend"
        if: ${{ !cancelled() }}
        working-directory: app/sso-frontend
        run: |
          npm ci
          npm test

  # The one test check branch protection requires. It passes when every test
  # job passed or was skipped, and fails when any of them failed or was
  # cancelled. New test jobs go into its needs list.
  tests:
    needs: [changes, backend-tests, frontend-tests]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
