# Fast checks on pull requests into main and on pushes to main: lint and the
# unit tests, plus the browser tests on pull requests that change a
# frontend. The slow checks (dependency audits, production builds, the
# Compose stack and the browser tests) run in release-checks.yml, on
# release/* branches and before a release's images are built. docs/ci.md
# explains the split and the branch protection rules that go with it.
#
# Branch protection requires two checks from this file: "lint" and "tests".
# Both always report, so a required check is never left waiting. "lint" is
# skipped when the change touches nothing it checks (a docs-only change, for
# example), and GitHub counts a skipped job as passed. "tests" passes when the
# test jobs it waits for were skipped because the change did not touch their
# part of the code.
#
# Draft pull requests run nothing; the checks start when the PR is marked
# ready for review.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # release-checks.yml runs this file with full: true, which runs every job
  # whatever the change touched.
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.full && 'full' || 'fast' }}
  cancel-in-progress: true

jobs:
  # Which lint steps and test jobs the change needs. Only these paths run
  # them, and a change to ci.yml itself runs everything:
  #   backend lint       app/backend/, plugins/
  #   club app lint      app/frontend/, packages/, plugins/
  #   manage lint        app/admin-frontend/, packages/, plugins/
  #   SSO lint           app/sso-frontend/, packages/, plugins/
  #   deploy lint        docker-compose*.yml, .env.example, settings.yaml,
  #                      deploy/, modules/, scripts/, app/deploy/
  #   backend tests      app/backend/, plugins/, settings.yaml
  #   frontend tests     app/*frontend/, packages/, plugins/
  #   browser tests      the same paths, on pull requests only
  # Everything else (docs, the other workflows, brand/, tools/, ...) runs
  # nothing: "lint" and "tests" then report as skipped, which branch
  # protection counts as passed.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontends: ${{ steps.diff.outputs.frontends }}
      lint: ${{ steps.diff.outputs.lint }}
      lint_backend: ${{ steps.diff.outputs.lint_backend }}
      lint_frontend: ${{ steps.diff.outputs.lint_frontend }}
      lint_admin: ${{ steps.diff.outputs.lint_admin }}
      lint_sso: ${{ steps.diff.outputs.lint_sso }}
      lint_deploy: ${{ steps.diff.outputs.lint_deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          FULL: ${{ inputs.full && 'true' || 'false' }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$FULL" = true ] || ! files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            # Full run, or unknown base (new branch, force push): run everything.
            for o in backend frontends lint lint_backend lint_frontend lint_admin lint_sso lint_deploy; do
              echo "$o=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "$files"
          # out NAME REGEX: NAME=true when a changed file matches REGEX or is
          # ci.yml itself. lint=true when any lint_* output is true.
          lint=false
          out() {
            if echo "$files" | grep -qE "^($2|\.github/workflows/ci\.yml$)"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              case "$1" in lint_*) lint=true ;; esac
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          out backend       'app/backend/|plugins/|settings\.yaml$'
          out frontends     'app/(frontend|admin-frontend|sso-frontend)/|packages/|plugins/'
          out lint_backend  'app/backend/|plugins/'
          out lint_frontend 'app/frontend/|packages/|plugins/'
          out lint_admin    'app/admin-frontend/|packages/|plugins/'
          out lint_sso      'app/sso-frontend/|packages/|plugins/'
          out lint_deploy   'docker-compose[^/]*\.yml$|\.env\.example$|settings\.yaml$|deploy/|modules/|scripts/|app/deploy/'
          echo "lint=$lint" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # The linters and type checks for the parts of the code the change touched
  # (see "changes" above). Required on main: a change with nothing to lint
  # skips the job, which branch protection counts as passed. If "changes"
  # failed, its outputs are empty, so the job and every step run: a broken
  # diff never skips lint. Every step runs even when an earlier one failed,
  # so one run shows all failures.
  lint:
    needs: changes
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && needs.changes.outputs.lint != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only when a frontend is linted: with no npm install, the cache save
      # at the end of the job fails.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: >-
          needs.changes.outputs.lint_frontend != 'false'
          || needs.changes.outputs.lint_admin != 'false'
          || needs.changes.outputs.lint_sso != 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/admin-frontend/package-lock.json
            app/sso-frontend/package-lock.json
      - name: "backend: ruff"
        if: ${{ !cancelled() && needs.changes.outputs.lint_backend != 'false' }}
        working-directory: app/backend
        run: |
          pipx run ruff==0.15.17 check .
      - name: "frontend: eslint and tsc"
        if: ${{ !cancelled() && needs.changes.outputs.lint_frontend != 'false' }}
        working-directory: app/frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: "admin-frontend: eslint and tsc"
        if: ${{ !cancelled() && needs.changes.outputs.lint_admin != 'false' }}
        working-directory: app/admin-frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: "sso-frontend: eslint and tsc"
        if: ${{ !cancelled() && needs.changes.outputs.lint_sso != 'false' }}
        working-directory: app/sso-frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: Compose files
        if: ${{ !cancelled() && needs.changes.outputs.lint_deploy != 'false' }}
        run: |
          scripts/init-env.sh
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
          docker compose -f docker-compose.yml -f modules/mail/docker-compose.mail.yml config -q
      - name: Kustomize and kubeconform
        if: ${{ !cancelled() && needs.changes.outputs.lint_deploy != 'false' }}
        run: |
          set -e
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform

          for dir in deploy/app deploy/vollbuild-ch deploy/clusters/contabo modules/mail/k8s; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone "$dir" > "/tmp/$(basename "$dir").yaml"
          done
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/app.yaml /tmp/vollbuild-ch.yaml /tmp/contabo.yaml /tmp/k8s.yaml
      - name: Shell scripts
        if: ${{ !cancelled() && needs.changes.outputs.lint_deploy != 'false' }}
        run: shellcheck deploy/create-secrets.sh scripts/init-env.sh scripts/smoke-test.sh scripts/image-reuse.sh app/deploy/nginx/40-hubra-runtime.sh

  # Backend unit tests on in-memory SQLite (TestingConfig); no services needed.
  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps --require-hashes -r requirements.lock
      - run: pip install pytest pytest-flask
      # age encrypts backups; tests/test_backup_age.py runs the real tool.
      - run: sudo apt-get install -y --no-install-recommends age
      - run: pytest -q

  # Frontend unit tests (vitest in the club app, node --test in SSO).
  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontends == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/sso-frontend/package-lock.json
      - name: "frontend"
        if: ${{ !cancelled() }}
        working-directory: app/frontend
        run: |
          npm ci
          npm test
      - name: "sso-frontend"
        if: ${{ !cancelled() }}
        working-directory: app/sso-frontend
        run: |
          npm ci
          npm test

  # The browser tests (app/frontend/e2e) against the Compose stack, on pull
  # requests that change a frontend, so a screen change that breaks them
  # shows up here instead of at the next image build. Release checks run
  # them on every build (compose-smoke), so a full run skips them here.
  browser-tests:
    needs: changes
    if: github.event_name == 'pull_request' && !inputs.full && needs.changes.outputs.frontends == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        # The e2e account is a platform admin that signs in with a password
        # only, so the two-factor rule for staff is off for this stack.
        run: |
          scripts/init-env.sh
          echo "MFA_REQUIRED_FOR_STAFF=false" >> .env
          echo "STEP_UP_ENFORCED=false" >> .env
      - run: docker compose build
      - run: docker compose up -d
      - run: scripts/smoke-test.sh
      - name: Club and account for the browser tests
        run: |
          password="E2e-Test-$(date +%s)!"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          docker compose exec -T backend flask provision-tenant \
            --name "E2E Club" --slug e2e --admin-email e2e@hubra.test --admin-password "$password"
          docker compose exec -T -e SUPERADMIN_EMAILS=e2e@hubra.test backend flask ensure-superadmins
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Browser tests
        working-directory: app/frontend
        env:
          E2E_APP_URL: http://localhost:8080
          E2E_MANAGE_URL: http://localhost:8081
          E2E_SSO_URL: http://localhost:8082
          E2E_CLUB: e2e
          E2E_EMAIL: e2e@hubra.test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=200

  # The one test check branch protection requires. It passes when every test
  # job passed or was skipped, and fails when any of them failed or was
  # cancelled. New test jobs go into its needs list.
  tests:
    needs: [changes, backend-tests, frontend-tests, browser-tests]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
