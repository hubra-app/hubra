# Fast checks on pull requests into main and on pushes to main: lint and the
# unit tests, plus the browser tests when a change reaches what the browser
# sees (see "changes" below). The slow checks (dependency audits, production builds, the
# Compose stack and the browser tests) run in release-checks.yml, on
# release/* branches and before a release's images are built. docs/ci.md
# explains the split and the branch protection rules that go with it.
#
# Branch protection requires two checks from this file: "lint" and "tests".
# Both always report, so a required check is never left waiting. "lint" is
# skipped when the change touches nothing it checks (a docs-only change, for
# example), and GitHub counts a skipped job as passed. "tests" passes when the
# test jobs it waits for were skipped because the change did not touch their
# part of the code.
#
# Draft pull requests run nothing; the checks start when the PR is marked
# ready for review.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # release-checks.yml runs this file with full: true, which runs every job
  # whatever the change touched, except the ones release checks run their own
  # way (browser-tests, backend-postgres).
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.full && 'full' || 'fast' }}
  cancel-in-progress: true

jobs:
  # Which lint steps and test jobs the change needs. Only these paths run
  # them, and a change to ci.yml itself runs everything:
  #   backend lint       app/backend/, plugins/
  #   club app lint      app/frontend/, packages/, plugins/
  #   manage lint        app/admin-frontend/, packages/, plugins/
  #   SSO lint           app/sso-frontend/, packages/, plugins/
  #   support lint       app/support-frontend/, packages/
  #   deploy lint        docker-compose*.yml, .env.example, settings.yaml,
  #                      modules/, scripts/, app/deploy/
  #   backend tests      app/backend/, plugins/, settings.yaml
  #   connector tests    app/mcp/ (ruff + pytest, docs/mcp.md)
  #   release check      release.yml, scripts/release_check.py, the version
  #                      and the changelogs (even a version-only bump)
  #   frontend tests     app/*frontend/, packages/, plugins/
  #   browser tests      what the browser sees: app/*frontend/, packages/,
  #                      plugins/, the backend code that serves the API
  #                      (app/backend/ except tests/, Celery tasks and mail
  #                      templates), migrations, the changelogs and the
  #                      roadmap (What's new shows them), the Compose stack
  #                      (docker-compose.yml, app/deploy/, settings.yaml)
  #                      and the e2e setup (.github/e2e/, scripts/
  #                      init-env.sh, smoke-test.sh, e2e-accounts.sh)
  # Text files are left out wherever they are: Markdown (*.md, so also
  # CHANGELOG.md and CHANGELOG.de.md), README files and .gitignore files. They
  # do not change what the code does; release-checks.yml (full: true) still
  # runs every test, including the changelog checks, before a release.
  # A version bump runs nothing either: a change to app/backend/pyproject.toml
  # that only edits the version line is left out, and so is a changelog
  # change that only adds "## [x.y.z] - date" headings.
  # Everything else (docs, the other workflows, brand/, tools/, ...) runs
  # nothing: "lint" and "tests" then report as skipped, which branch
  # protection counts as passed.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      mcp: ${{ steps.diff.outputs.mcp }}
      frontends: ${{ steps.diff.outputs.frontends }}
      browser: ${{ steps.diff.outputs.browser }}
      lint: ${{ steps.diff.outputs.lint }}
      lint_backend: ${{ steps.diff.outputs.lint_backend }}
      lint_frontend: ${{ steps.diff.outputs.lint_frontend }}
      lint_admin: ${{ steps.diff.outputs.lint_admin }}
      lint_sso: ${{ steps.diff.outputs.lint_sso }}
      lint_support: ${{ steps.diff.outputs.lint_support }}
      lint_deploy: ${{ steps.diff.outputs.lint_deploy }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          FULL: ${{ inputs.full && 'true' || 'false' }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$FULL" = true ] || ! files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            # Full run, or unknown base (new branch, force push): run everything.
            for o in backend mcp frontends browser release lint lint_backend lint_frontend lint_admin lint_sso lint_support lint_deploy; do
              echo "$o=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "$files"
          # The release check reads the version and the changelog, so it runs
          # before any text file or version-only line is left out below.
          if echo "$files" | grep -qE '^(\.github/workflows/(release|ci)\.yml|scripts/(test_)?release_check\.py|app/backend/(pyproject\.toml|CHANGELOG(\.de)?\.md))$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          # A version bump (bnb bump) changes only the version line in
          # app/backend/pyproject.toml and adds a "## [x.y.z] - date" heading
          # to the changelogs. Such lines run nothing; release-checks.yml
          # (full: true) still runs every test before the release.
          # only_lines FILE REGEX: true when every added or removed line of
          # FILE matches REGEX (blank lines always do).
          only_lines() {
            other=$(git diff -U0 "$BASE...$HEAD" -- "$1" \
              | grep -E '^[-+]' | grep -vE '^(\+\+\+ b/|--- a/)' \
              | grep -vE "^[-+]($2|[[:space:]]*)$" || true)
            [ -z "$other" ]
          }
          if echo "$files" | grep -qx 'app/backend/pyproject.toml' \
            && only_lines app/backend/pyproject.toml 'version = "[^"]*"'; then
            echo "app/backend/pyproject.toml: version only"
            files=$(echo "$files" | grep -vx 'app/backend/pyproject.toml' || true)
          fi
          # The changelogs are Markdown but What's new shows them, so they
          # count for the browser tests before the text files are dropped,
          # unless the change only adds version headings.
          changelog=false
          for f in app/backend/CHANGELOG.md app/backend/CHANGELOG.de.md; do
            if echo "$files" | grep -qx "$f" \
              && ! only_lines "$f" '## \[[0-9][^]]*\]( - [0-9-]+)?'; then
              changelog=true
            fi
          done
          # Text files never run anything (see the list above).
          files=$(echo "$files" | grep -vE '(\.md|(^|/)README|(^|/)\.gitignore)$' || true)
          # out NAME REGEX [FORCE]: NAME=true when a changed file matches
          # REGEX or is ci.yml itself, or FORCE is true. lint=true when any
          # lint_* output is true.
          lint=false
          out() {
            if [ "${3:-false}" = true ] || echo "$files" | grep -qE "^($2|\.github/workflows/ci\.yml$)"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              case "$1" in lint_*) lint=true ;; esac
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          out backend       'app/backend/|plugins/|settings\.yaml$'
          out mcp           'app/mcp/'
          out frontends     'app/(frontend|admin-frontend|sso-frontend|support-frontend)/|packages/|plugins/'
          # Backend changes the browser cannot see (unit tests, Celery tasks,
          # mail templates) are left out before the browser paths are checked.
          all=$files
          files=$(echo "$all" | grep -vE '^app/backend/(tests/|hubra/core/tasks/|hubra/templates/)' || true)
          out browser       'app/(frontend|admin-frontend|sso-frontend|support-frontend)/|packages/|plugins/|app/backend/(hubra/|migrations/|Dockerfile$|requirements\.lock$|gunicorn\.conf\.py$|wsgi\.py$|ROADMAP\.yaml$)|app/deploy/|docker-compose\.yml$|settings\.yaml$|\.github/e2e/|scripts/(init-env|smoke-test|e2e-accounts|pg-start)\.sh$' "$changelog"
          files=$all
          out lint_backend  'app/backend/|plugins/'
          out lint_frontend 'app/frontend/|packages/|plugins/'
          out lint_admin    'app/admin-frontend/|packages/|plugins/'
          out lint_sso      'app/sso-frontend/|packages/|plugins/'
          out lint_support  'app/support-frontend/|packages/'
          out lint_deploy   'docker-compose[^/]*\.yml$|\.env\.example$|settings\.yaml$|modules/|scripts/|app/deploy/|\.github/e2e/'
          echo "lint=$lint" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # The linters and type checks for the parts of the code the change touched
  # (see "changes" above). Required on main: a change with nothing to lint
  # skips the job, which branch protection counts as passed. If "changes"
  # failed, its outputs are empty, so the job and every step run: a broken
  # diff never skips lint. Every step runs even when an earlier one failed,
  # so one run shows all failures.
  lint:
    needs: changes
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && needs.changes.outputs.lint != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only when a frontend is linted: with no npm install, the cache save
      # at the end of the job fails.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: >-
          needs.changes.outputs.lint_frontend != 'false'
          || needs.changes.outputs.lint_admin != 'false'
          || needs.changes.outputs.lint_sso != 'false'
          || needs.changes.outputs.lint_support != 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/admin-frontend/package-lock.json
            app/sso-frontend/package-lock.json
            app/support-frontend/package-lock.json
      - name: "backend: ruff"
        if: ${{ !cancelled() && needs.changes.outputs.lint_backend != 'false' }}
        working-directory: app/backend
        run: |
          pipx run ruff==0.15.17 check .
      # Type check (pyrightconfig.json at the repo root). Only the checks
      # the code passes today are on; turn the next one on once it is
      # clean, never off again.
      - name: "backend: pyright"
        if: ${{ !cancelled() && needs.changes.outputs.lint_backend != 'false' }}
        run: |
          pipx run pyright==1.1.408
      - name: "frontend: eslint and tsc"
        if: ${{ !cancelled() && needs.changes.outputs.lint_frontend != 'false' }}
        working-directory: app/frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: "admin-frontend: eslint and tsc"
        if: ${{ !cancelled() && needs.changes.outputs.lint_admin != 'false' }}
        working-directory: app/admin-frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: "sso-frontend: eslint and tsc"
        if: ${{ !cancelled() && needs.changes.outputs.lint_sso != 'false' }}
        working-directory: app/sso-frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: "support-frontend: eslint and tsc"
        if: ${{ !cancelled() && needs.changes.outputs.lint_support != 'false' }}
        working-directory: app/support-frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b
      - name: Compose files
        if: ${{ !cancelled() && needs.changes.outputs.lint_deploy != 'false' }}
        run: |
          scripts/init-env.sh
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
          docker compose -f docker-compose.yml -f modules/mail/docker-compose.mail.yml config -q
          docker compose -f docker-compose.yml -f .github/e2e/docker-compose.e2e.yml config -q
      - name: Shell scripts
        if: ${{ !cancelled() && needs.changes.outputs.lint_deploy != 'false' }}
        run: shellcheck scripts/init-env.sh scripts/smoke-test.sh scripts/pg-start.sh scripts/pg-upgrade-18.sh scripts/image-reuse.sh scripts/e2e-accounts.sh app/deploy/nginx/40-hubra-runtime.sh

  # Backend unit tests on in-memory SQLite (TestingConfig); no services needed.
  # pytest -n auto runs them on every CPU of the runner (pytest-xdist); each
  # worker has its own in-memory database. release-checks.yml runs the same
  # suite once more on Postgres.
  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps --require-hashes -r requirements.lock
      - run: pip install pytest pytest-flask pytest-xdist
      # age encrypts backups; tests/test_backup_age.py runs the real tool.
      - run: sudo apt-get install -y --no-install-recommends age
      - run: pytest -q -n auto

  # The same suite on Postgres (schema per club, search_path, advisory locks,
  # the outbox lease and the database limits only behave for real there).
  # About a minute with -n auto. Postgres 18, the version Compose and
  # production run. A full run (release-checks.yml) skips it: release checks
  # run it with the pg_dump 18 client too, so a release runs it only once.
  backend-postgres:
    needs: changes
    if: "!inputs.full && needs.changes.outputs.backend == 'true'"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hubra
          POSTGRES_PASSWORD: hubra
          POSTGRES_DB: hubra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hubra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app/backend
    env:
      TEST_DATABASE_URL: postgresql://hubra:hubra@localhost:5432/hubra_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps --require-hashes -r requirements.lock
      - run: pip install pytest pytest-flask pytest-xdist
      - run: sudo apt-get install -y --no-install-recommends age
      - run: pytest -q -n auto -rs

  # The Claude connector (app/mcp): lint and its own tests, against a fake
  # Hubra API. The backend side of it is in tests/auth/test_api_tokens.py.
  mcp-tests:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/mcp/requirements.lock
      - run: pip install --no-deps --require-hashes -r requirements.lock
      - run: pip install pytest ruff==0.15.17
      - run: ruff check . --line-length 100
      - run: pytest -q

  # Frontend unit tests (vitest in the club app, node --test in SSO and support).
  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontends == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/sso-frontend/package-lock.json
            app/support-frontend/package-lock.json
      - name: "frontend"
        if: ${{ !cancelled() }}
        working-directory: app/frontend
        run: |
          npm ci
          npm test
      - name: "sso-frontend"
        if: ${{ !cancelled() }}
        working-directory: app/sso-frontend
        run: |
          npm ci
          npm test
      - name: "support-frontend"
        if: ${{ !cancelled() }}
        working-directory: app/support-frontend
        run: |
          npm ci
          npm test

  # The browser tests (app/frontend/e2e) against the Compose stack, when a
  # change reaches what the browser sees (see "changes"): on pull requests,
  # so a screen change that breaks them shows up before the merge, and on
  # pushes to main, so a combination of two merges that breaks them shows up
  # right after. Release checks run them on every build (compose-smoke), so a
  # full run skips them here. docs/ci.md has the timings.
  #
  # What keeps it short:
  # - The images build with Buildx and a layer cache in the GitHub Actions
  #   cache, one scope per image. main fills it; a pull request reads main's
  #   cache and its own from earlier pushes, so an unchanged image (often the
  #   backend or two of the three frontends) is not rebuilt.
  # - npm ci and the Playwright browser install run while the stack starts.
  # - The tests run in E2E_WORKERS parallel workers, each with its own club
  #   and account (scripts/e2e-accounts.sh, app/frontend/e2e/env.ts), so they
  #   cannot see each other's changes. .github/e2e/docker-compose.e2e.yml
  #   gives the backend the CPUs for that.
  browser-tests:
    needs: changes
    if: >-
      !inputs.full
      && (github.event_name == 'pull_request' || github.event_name == 'push')
      && needs.changes.outputs.browser != 'false'
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:.github/e2e/docker-compose.e2e.yml
      E2E_WORKERS: "3"
      E2E_APP_URL: http://localhost:8080
      E2E_MANAGE_URL: http://localhost:8081
      E2E_SSO_URL: http://localhost:8082
      E2E_SUPPORT_URL: http://localhost:8083
      E2E_CLUB: e2e
      E2E_EMAIL: e2e@hubra.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        # The e2e accounts are platform admins that sign in with a password
        # only, so the two-factor rule for staff is off for this stack.
        run: |
          scripts/init-env.sh
          echo "MFA_REQUIRED_FOR_STAFF=false" >> .env
          echo "STEP_UP_ENFORCED=false" >> .env
          password="E2e-Test-$(date +%s)!"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the images (cached)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          targets: backend,frontend,admin-frontend,sso-frontend,support-frontend
          load: true
          set: |
            backend.cache-from=type=gha,scope=e2e-backend
            backend.cache-to=type=gha,mode=max,scope=e2e-backend,ignore-error=true
            frontend.cache-from=type=gha,scope=e2e-frontend
            frontend.cache-to=type=gha,mode=max,scope=e2e-frontend,ignore-error=true
            admin-frontend.cache-from=type=gha,scope=e2e-admin-frontend
            admin-frontend.cache-to=type=gha,mode=max,scope=e2e-admin-frontend,ignore-error=true
            sso-frontend.cache-from=type=gha,scope=e2e-sso-frontend
            sso-frontend.cache-to=type=gha,mode=max,scope=e2e-sso-frontend,ignore-error=true
            support-frontend.cache-from=type=gha,scope=e2e-support-frontend
            support-frontend.cache-to=type=gha,mode=max,scope=e2e-support-frontend,ignore-error=true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Start the stack, install the test tools meanwhile
        # The headless shell is all the tests launch; the full Chrome is not
        # downloaded.
        run: |
          docker compose up -d --no-build > /tmp/compose-up.log 2>&1 &
          up=$!
          (cd app/frontend && npm ci && npx playwright install --with-deps --only-shell chromium)
          wait "$up" || { cat /tmp/compose-up.log; exit 1; }
          cat /tmp/compose-up.log
          scripts/smoke-test.sh
      - name: Clubs and accounts for the browser tests
        run: scripts/e2e-accounts.sh
      - name: Browser tests
        working-directory: app/frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=200

  # The tag checks and release notes of release.yml (scripts/release_check.py)
  # for the version pyproject.toml declares, plus their unit tests: a release
  # bug shows up here, not after a v* tag that cannot be moved. Standard
  # library only, no install.
  release-check:
    needs: changes
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && needs.changes.outputs.release != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_release_check.py' -v
      - name: Check and notes for this version
        run: scripts/release-dry-run.sh

  # The one test check branch protection requires. It passes when every test
  # job passed or was skipped, and fails when any of them failed or was
  # cancelled. New test jobs go into its needs list.
  tests:
    needs: [changes, backend-tests, backend-postgres, mcp-tests, frontend-tests, browser-tests, release-check]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
