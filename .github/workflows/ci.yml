# Tests and checks on pull requests and on main.
# Container images are built by images.yml.
#
# To save Actions minutes: draft pull requests run nothing (the checks start
# when the PR is marked ready for review), changes that only touch docs run
# nothing, and the small checks share one job, since every job is billed
# rounded up to a full minute.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps -r requirements.lock
      - run: pip install pytest pytest-flask ruff==0.15.17 pip-audit==2.10.0
      - run: ruff check .
      - name: Known vulnerabilities in the locked dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      # Tests run on in-memory SQLite (TestingConfig); no services needed.
      - run: pytest -q

  # The three frontends and the deploy config, one after the other. Every
  # step runs even when an earlier one failed, so one run shows all failures.
  frontends:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/admin-frontend/package-lock.json
            app/sso-frontend/package-lock.json
      - name: "frontend"
        if: ${{ !cancelled() }}
        working-directory: app/frontend
        run: |
          npm ci
          # Known vulnerabilities (runtime dependencies, high and critical)
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test --if-present
          npm run build
      - name: "admin-frontend"
        if: ${{ !cancelled() }}
        working-directory: app/admin-frontend
        run: |
          npm ci
          # Known vulnerabilities (runtime dependencies, high and critical)
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test --if-present
          npm run build
      - name: "sso-frontend"
        if: ${{ !cancelled() }}
        working-directory: app/sso-frontend
        run: |
          npm ci
          # Known vulnerabilities (runtime dependencies, high and critical)
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test --if-present
          npm run build
      - name: Compose files
        if: ${{ !cancelled() }}
        run: |
          scripts/init-env.sh
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
          docker compose -f docker-compose.yml -f modules/mail/docker-compose.mail.yml config -q
      - name: Kustomize and kubeconform
        if: ${{ !cancelled() }}
        run: |
          set -e
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform

          for dir in deploy/app deploy/vollbuild-ch deploy/clusters/contabo modules/mail/k8s; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone "$dir" > "/tmp/$(basename "$dir").yaml"
          done
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/app.yaml /tmp/vollbuild-ch.yaml /tmp/contabo.yaml /tmp/k8s.yaml
      - name: Shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck deploy/create-secrets.sh scripts/init-env.sh scripts/smoke-test.sh app/deploy/nginx/40-hubra-runtime.sh

  # Builds the images and runs both Compose stacks end to end.
  compose-smoke:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: scripts/init-env.sh
      - run: docker compose build
      - run: docker compose up -d
      - run: scripts/smoke-test.sh
      # Browser tests of the three apps against the same stack (app/frontend/e2e).
      - name: Club and account for the browser tests
        run: |
          password="E2e-Test-$(date +%s)!"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          docker compose exec -T backend flask provision-tenant \
            --name "E2E Club" --slug e2e --admin-email e2e@hubra.test --admin-password "$password"
          docker compose exec -T -e SUPERADMIN_EMAILS=e2e@hubra.test backend flask ensure-superadmins
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Browser tests
        working-directory: app/frontend
        env:
          E2E_APP_URL: http://localhost:8080
          E2E_MANAGE_URL: http://localhost:8081
          E2E_SSO_URL: http://localhost:8082
          E2E_CLUB: e2e
          E2E_EMAIL: e2e@hubra.test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
