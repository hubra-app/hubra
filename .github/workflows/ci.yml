# Tests and checks on every pull request and on main.
# Container images are built by images.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: pip install --no-deps -r requirements.lock
      - run: pip install pytest pytest-flask ruff==0.15.17 pip-audit==2.10.0
      - run: ruff check .
      - name: Known vulnerabilities in the locked dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      # Tests run on in-memory SQLite (TestingConfig); no services needed.
      - run: pytest -q

  frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin-frontend, sso-frontend]
    defaults:
      run:
        working-directory: app/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities (runtime dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
      - if: matrix.app == 'frontend'
        name: Plugin frontends
        run: npm run typecheck:plugins && npm run build:plugin

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compose files
        run: |
          scripts/init-env.sh
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
          docker compose -f docker-compose.yml -f modules/mail/docker-compose.mail.yml config -q
      - name: Kustomize and kubeconform
        run: |
          set -e
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform

          for dir in deploy/app deploy/single-club deploy/vollbuild-ch deploy/clusters/contabo modules/mail/k8s; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone "$dir" > "/tmp/$(basename "$dir").yaml"
          done
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/app.yaml /tmp/single-club.yaml /tmp/vollbuild-ch.yaml /tmp/contabo.yaml /tmp/k8s.yaml
      - name: Shell scripts
        run: shellcheck deploy/create-secrets.sh scripts/init-env.sh scripts/smoke-test.sh app/deploy/nginx/40-hubra-runtime.sh

  # Builds the images and runs both Compose stacks end to end.
  compose-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [multi, single]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: |
          scripts/init-env.sh
          if [ "${{ matrix.mode }}" = single ]; then
            sed -i \
              -e 's/^SINGLE_CLUB=.*/SINGLE_CLUB=smoke/' \
              -e 's/^CLUB_NAME=.*/CLUB_NAME=Smoke Club/' \
              -e 's/^ADMIN_EMAIL=.*/ADMIN_EMAIL=admin@smoke.test/' \
              -e "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=Smoke-Test-$(openssl rand -hex 8)!/" \
              .env
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.single-club.yml" >> .env
          fi
      - run: docker compose build
      - run: docker compose up -d
      - run: scripts/smoke-test.sh ${{ matrix.mode }}
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
