[project]
name = "hubra"
version = "0.2.0"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hubra.core.extensions"
disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
module = [
    "hubra.core.models.*",
    "hubra.core.schemas.*",
]
disable_error_code = ["name-defined"]

[tool.pytest.ini_options]
# Hubra's tests, then the bundled plugins' (plugins/<id>/tests).
testpaths = ["tests", "../../plugins"]
filterwarnings = [
    # Third-party: pythonjsonlogger moved its module path in a newer version.
    # Suppress the deprecation warning until the library is updated.
    "ignore::DeprecationWarning",
    # SQLite in-memory + StaticPool keeps a single connection alive for the
    # session lifetime.  GC may collect it before the engine is disposed,
    # producing a ResourceWarning that is harmless in tests.
    "ignore::ResourceWarning",
]
