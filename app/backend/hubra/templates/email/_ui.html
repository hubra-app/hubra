{#- Building blocks for the mail templates, in the Hubra brand (brand/README.md), coloured
    with the club's main colour (mail_i18n.mail_colors).
    Styles are inline: many mail clients drop <style> blocks. -#}

{%- set font_body = "'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" -%}
{%- set font_mono = "'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" -%}

{% macro p() -%}
<p style="margin: 0 0 16px; font-family: {{ font_body }}; font-size: 15px; line-height: 24px; color: #1a1625;">{{ caller() }}</p>
{%- endmacro %}

{% macro muted() -%}
<p style="margin: 0 0 16px; font-family: {{ font_body }}; font-size: 13px; line-height: 20px; color: #5e5873;">{{ caller() }}</p>
{%- endmacro %}

{#- A button that works in Outlook too: the padding sits on the cell. -#}
{% macro button(url, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 8px 0 24px;">
  <tr>
    <td class="hb-button" align="center" bgcolor="{{ brand_color }}" style="border-radius: 10px; background: {{ brand_color }};">
      <a href="{{ url }}" target="_blank" style="display: inline-block; padding: 13px 24px; font-family: {{ font_body }}; font-size: 15px; font-weight: 700; line-height: 20px; color: {{ brand_on }}; text-decoration: none; border-radius: 10px;">{{ label }}</a>
    </td>
  </tr>
</table>
{%- endmacro %}

{#- The link under a button, for clients that don't show the button. -#}
{% macro fallback_link(url) -%}
<p style="margin: 0 0 16px; font-family: {{ font_body }}; font-size: 13px; line-height: 20px; color: #5e5873;">
  {{ t('mail.email.button_fallback') }}<br />
  <a href="{{ url }}" target="_blank" style="color: {{ brand_link }}; word-break: break-all;">{{ url }}</a>
</p>
{%- endmacro %}

{#- A box of label / value rows: rows is a list of (label, value, mono). -#}
{% macro facts(rows) -%}
<table class="hb-facts" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{ brand_tint }}" style="margin: 0 0 20px; background: {{ brand_tint }}; border-radius: 12px;">
  <tr><td style="padding: 8px 18px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {%- for label, value, mono in rows %}
      <tr>
        <td valign="top" style="padding: 8px 16px 8px 0; font-family: {{ font_body }}; font-size: 13px; line-height: 20px; color: #5e5873; white-space: nowrap; width: 1%;">{{ label }}</td>
        <td valign="top" style="padding: 8px 0; font-family: {{ font_mono if mono else font_body }}; font-size: {{ '14px' if mono else '15px' }}; line-height: 20px; font-weight: 600; color: #1a1625; overflow-wrap: anywhere;">{{ value }}</td>
      </tr>
      {%- endfor %}
    </table>
  </td></tr>
</table>
{%- endmacro %}
