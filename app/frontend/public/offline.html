<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7441e0" />
    <title>Hubra · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f6fb; --fg: #1d1a2b; --muted: #6b6680; --brand: #7441e0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15131d; --fg: #eeecf5; --muted: #a29db5; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 0 4px; color: var(--muted); font-size: 15px; }
      button { margin-top: 20px; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--brand); color: #fff;
        font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1 id="t">Keine Verbindung</h1>
      <p id="d">Hubra braucht Internet. Sobald dein Gerät wieder online ist, geht es weiter.</p>
      <button id="b" type="button">Nochmals versuchen</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
