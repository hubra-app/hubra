server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # A published archive never changes; the index does with every release.
    location = /index.json {
        add_header Cache-Control "no-cache";
    }
    location ~ \.zip$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        autoindex off;
        try_files $uri =404;
    }
}
