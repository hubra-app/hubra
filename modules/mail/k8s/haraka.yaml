# Haraka (inbound SMTP). Public port 25 via k3s ServiceLB. externalTrafficPolicy
# Local keeps the sender's real IP for SPF/RBL checks.
apiVersion: v1
kind: Service
metadata:
  name: haraka
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: haraka
  ports:
    - name: smtp
      port: 25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haraka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haraka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haraka
    spec:
      initContainers:
        - name: wait-for-cert
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - until [ -e "/etc/letsencrypt/live/$MAIL_HOST/fullchain.pem" ]; do echo "waiting for certbot-init"; sleep 10; done
          env:
            - name: MAIL_HOST
              valueFrom: { secretKeyRef: { name: club-env, key: MAIL_HOST } }
          volumeMounts:
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
      containers:
        - name: haraka
          image: club/haraka
          env:
            - name: SRS_SECRET
              valueFrom: { secretKeyRef: { name: club-env, key: SRS_SECRET } }
            - name: LOOP_SECRET
              valueFrom: { secretKeyRef: { name: club-env, key: LOOP_SECRET } }
            - name: REWRITE_DOMAIN
              valueFrom: { secretKeyRef: { name: club-env, key: REWRITE_DOMAIN } }
            - name: MAIL_HOST
              valueFrom: { secretKeyRef: { name: club-env, key: MAIL_HOST } }
          ports:
            - name: smtp
              containerPort: 25
          volumeMounts:
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
          readinessProbe:
            tcpSocket: { port: smtp }
            periodSeconds: 15
          resources:
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: letsencrypt
          persistentVolumeClaim:
            claimName: letsencrypt
