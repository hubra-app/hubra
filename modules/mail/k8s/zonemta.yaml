# ZoneMTA (outbound SMTP + submission). Public 465/587 via k3s ServiceLB; the
# same Service name `zonemta` is what the backend's ZONEMTA_SMTP_HOST points at.
# smtpInterfaces stay in the single zonemta.toml baked into the image.
apiVersion: v1
kind: Service
metadata:
  name: zonemta
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: zonemta
  ports:
    - name: smtps
      port: 465
    - name: submission
      port: 587
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zonemta
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zonemta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zonemta
    spec:
      initContainers:
        - name: wait-for-cert
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - until [ -e "/etc/letsencrypt/live/$MAIL_HOST/fullchain.pem" ]; do echo "waiting for certbot-init"; sleep 10; done
          env:
            - name: MAIL_HOST
              valueFrom: { secretKeyRef: { name: club-env, key: MAIL_HOST } }
          volumeMounts:
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
      containers:
        - name: zonemta
          image: club/zonemta
          env:
            - name: NODE_ENV
              valueFrom: { secretKeyRef: { name: club-env, key: NODE_ENV } }
            - name: SRS_SECRET
              valueFrom: { secretKeyRef: { name: club-env, key: SRS_SECRET } }
            - name: LOOP_SECRET
              valueFrom: { secretKeyRef: { name: club-env, key: LOOP_SECRET } }
            - name: MAIL_HOST
              valueFrom: { secretKeyRef: { name: club-env, key: MAIL_HOST } }
            - name: REWRITE_DOMAIN
              valueFrom: { secretKeyRef: { name: club-env, key: REWRITE_DOMAIN } }
          ports:
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
          volumeMounts:
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
          readinessProbe:
            tcpSocket: { port: submission }
            periodSeconds: 15
          resources:
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: letsencrypt
          persistentVolumeClaim:
            claimName: letsencrypt
