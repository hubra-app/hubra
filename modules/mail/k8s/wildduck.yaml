# WildDuck (IMAP + API). Compose service name `mailserver` is kept so the
# backend's WILDDUCK_API_URL and Haraka's LMTP target resolve unchanged.
apiVersion: v1
kind: Service
metadata:
  name: mailserver
spec:
  selector:
    app.kubernetes.io/name: mailserver
  ports:
    - name: lmtp
      port: 24
    - name: api
      port: 8080
---
# Public IMAPS on the node's port 993 via k3s ServiceLB (Compose: "993:9993").
apiVersion: v1
kind: Service
metadata:
  name: mail-imaps
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: mailserver
  ports:
    - name: imaps
      port: 993
      targetPort: 9993
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailserver
    spec:
      initContainers:
        - name: wait-for-cert
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - until [ -e "/etc/letsencrypt/live/$MAIL_HOST/fullchain.pem" ]; do echo "waiting for certbot-init"; sleep 10; done
          env:
            - name: MAIL_HOST
              valueFrom: { secretKeyRef: { name: hubra-env, key: MAIL_HOST } }
          volumeMounts:
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
      containers:
        - name: wildduck
          image: ghcr.io/zone-eu/wildduck:latest@sha256:d37c43ccda33ef69d11b5afdc888623434fdbc20080d653aa901dc7df83f5000
          env:
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: hubra-env, key: MONGO_USER } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: hubra-env, key: MONGO_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: hubra-env, key: REDIS_PASSWORD } }
            - name: MAIL_HOST
              valueFrom: { secretKeyRef: { name: hubra-env, key: MAIL_HOST } }
            - name: APPCONF_dbs_sender
              valueFrom: { secretKeyRef: { name: hubra-env, key: APPCONF_dbs_sender } }
            - name: APPCONF_api_host
              valueFrom: { secretKeyRef: { name: hubra-env, key: APPCONF_api_host } }
            - name: APPCONF_api_port
              valueFrom: { secretKeyRef: { name: hubra-env, key: APPCONF_api_port } }
            - name: APPCONF_api_accessToken
              valueFrom: { secretKeyRef: { name: hubra-env, key: WILDDUCK_API_TOKEN } }
            - name: APPCONF_emailDomain
              valueFrom: { secretKeyRef: { name: hubra-env, key: MAIL_DOMAIN } }
            - name: APPCONF_sender_loopSecret
              valueFrom: { secretKeyRef: { name: hubra-env, key: LOOP_SECRET } }
            - name: APPCONF_webhooks_enabled
              valueFrom: { secretKeyRef: { name: hubra-env, key: APPCONF_webhooks_enabled } }
            - name: APPCONF_dbs_mongo
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongo:27017/wildduck?authSource=admin
            - name: APPCONF_dbs_redis
              value: redis://:$(REDIS_PASSWORD)@redis:6379/3
            - name: APPCONF_webhooks_redis
              value: redis://:$(REDIS_PASSWORD)@redis:6379/3
            - name: APPCONF_imap_setup_hostname
              value: $(MAIL_HOST)
            - name: APPCONF_imap_setup_key
              value: /etc/letsencrypt/live/$(MAIL_HOST)/privkey.pem
            - name: APPCONF_imap_setup_cert
              value: /etc/letsencrypt/live/$(MAIL_HOST)/fullchain.pem
            - name: APPCONF_imap_tls_key
              value: /etc/letsencrypt/live/$(MAIL_HOST)/privkey.pem
            - name: APPCONF_imap_tls_cert
              value: /etc/letsencrypt/live/$(MAIL_HOST)/fullchain.pem
          ports:
            - name: imaps
              containerPort: 9993
            - name: lmtp
              containerPort: 24
            - name: api
              containerPort: 8080
          volumeMounts:
            - name: mail-data
              mountPath: /var/lib/wildduck
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
          readinessProbe:
            tcpSocket: { port: imaps }
            periodSeconds: 15
          resources:
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: mail-data
          persistentVolumeClaim:
            claimName: mail-data
        - name: letsencrypt
          persistentVolumeClaim:
            claimName: letsencrypt
