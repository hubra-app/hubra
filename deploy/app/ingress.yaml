# Host routing that used to live in traefik labels in docker-compose.override.yaml.
# k3s ships Traefik as the default ingress class; cert-manager issues the cert.
#
# Do NOT add CORS headers here: the Flask app owns CORS (single source of
# truth); a duplicate Access-Control-Allow-Origin makes browsers reject every
# response. The old crowdsec@file / error-pages-middleware middlewares are not
# ported yet (see docs/k3s.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubra
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: hubra-tls
      hosts:
        - api.vollbuild.ch
        - cos.vollbuild.ch
        - manage.vollbuild.ch
        - sso.vollbuild.ch
  rules:
    - host: api.vollbuild.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
    - host: cos.vollbuild.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
    - host: manage.vollbuild.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: admin-frontend, port: { name: http } }
    - host: sso.vollbuild.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sso-frontend, port: { name: http } }
