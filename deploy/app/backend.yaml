# The club app backend: API, Celery worker and the Discord gateway, run with
# HUBRA_ROLE=app, so the API serves /api/v1/app and plugin routes. Sign-in,
# account and public data live in global-backend.yaml; the platform API, the
# platform worker and the init step in platform-backend.yaml
# (docs/platform-backend.md). A release of either doesn't roll these pods.
#
# The API's initContainers don't migrate: they wait until the platform backend
# has brought the schema up to this release (python -m hubra.core.schema_wait),
# then fill the club permission catalog from the club routes and plugins
# (flask sync-permissions), and the old pod keeps serving meanwhile. API and worker replicas are fine.
# Beat runs the platform image (below) and needs no more than one replica:
# see docs/scaling.md.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  # Start the new pod and let it pass its readiness probe before the old one
  # stops: no gap even with one replica.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        # appuser (uid 1000) from app/backend/Dockerfile; numeric, so the
        # kubelet can check runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # Time for Traefik to drop the old pod before gunicorn stops (preStop).
      terminationGracePeriodSeconds: 60
      initContainers:
        # The platform backend migrates; this waits until it has (up to
        # SCHEMA_WAIT_TIMEOUT, default 15 min, then the pod restarts).
        - name: schema-wait
          image: hubra/backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command: ["python", "-m", "hubra.core.schema_wait"]
          envFrom: [{ secretRef: { name: hubra-env } }]
        # The club permission catalog comes from the club routes and plugins,
        # which only this backend loads (the platform init step leaves it).
        # startup_lock: two pods starting together take turns.
        - name: club-permissions
          image: hubra/backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command: ["python", "-m", "hubra.core.startup_lock", "flask", "sync-permissions"]
          envFrom: [{ secretRef: { name: hubra-env } }]
          env:
            - { name: SETTINGS_FILE, value: /etc/hubra/settings.yaml }
            - { name: HUBRA_ROLE, value: app }
          volumeMounts: [{ name: settings, mountPath: /etc/hubra }]
      containers:
        - name: backend
          image: hubra/backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ name: http, containerPort: 5000 }]
          envFrom: [{ secretRef: { name: hubra-env } }]
          env:
            - { name: SETTINGS_FILE, value: /etc/hubra/settings.yaml }
            - { name: HUBRA_ROLE, value: app }
            - { name: HUBRA_PLATFORM_QUEUE, value: platform }
          volumeMounts: [{ name: settings, mountPath: /etc/hubra }]
          readinessProbe:
            httpGet: { path: /health, port: http }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
          resources:
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: settings
          configMap: { name: hubra-settings }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        # appuser (uid 1000) from app/backend/Dockerfile; numeric, so the
        # kubelet can check runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: celery-worker
          image: hubra/backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # The default queue only; platform tasks go to platform-worker.
          command: ["celery", "-A", "hubra.core.tasks.celery_app", "worker", "--loglevel=info"]
          envFrom: [{ secretRef: { name: hubra-env } }]
          env:
            - { name: SETTINGS_FILE, value: /etc/hubra/settings.yaml }
            - { name: HUBRA_ROLE, value: app }
            - { name: HUBRA_PLATFORM_QUEUE, value: platform }
          volumeMounts: [{ name: settings, mountPath: /etc/hubra }]
          resources:
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: settings
          configMap: { name: hubra-settings }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celerybeat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate # never two schedulers
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        # appuser (uid 1000) from app/backend/Dockerfile; numeric, so the
        # kubelet can check runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 # so beat can write its schedule to the volume
      containers:
        - name: celery-beat
          # The platform image: beat holds every schedule (club and platform),
          # and the platform release is never older than the club one. The
          # image sets HUBRA_ROLE=platform; beat imports no route (schedules
          # name their tasks).
          image: hubra/platform-backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command: ["celery", "-A", "hubra.core.tasks.celery_app", "beat", "--loglevel=info", "--schedule", "/celerybeat/celerybeat-schedule"]
          envFrom: [{ secretRef: { name: hubra-env } }]
          env:
            - { name: SETTINGS_FILE, value: /etc/hubra/settings.yaml }
            - { name: HUBRA_PLATFORM_QUEUE, value: platform }
          volumeMounts:
            - { name: settings, mountPath: /etc/hubra }
            - { name: schedule, mountPath: /celerybeat }
          resources:
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: settings
          configMap: { name: hubra-settings }
        - name: schedule
          persistentVolumeClaim: { claimName: celerybeat }
---
# The Discord gateway (welcome message, roles on join; docs/discord.md). It
# waits quietly until the Discord plugin is installed and the bot is set up.
# Exactly one: Discord allows one gateway session per bot without sharding.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-gateway
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: discord-gateway
          image: hubra/backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command: ["flask", "modules", "run", "discord-gateway", "--wait", "600"]
          envFrom: [{ secretRef: { name: hubra-env } }]
          env:
            - { name: SETTINGS_FILE, value: /etc/hubra/settings.yaml }
            - { name: HUBRA_ROLE, value: app }
            - { name: HUBRA_PLATFORM_QUEUE, value: platform }
          volumeMounts: [{ name: settings, mountPath: /etc/hubra }]
          resources:
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: settings
          configMap: { name: hubra-settings }
