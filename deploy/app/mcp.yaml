# The Claude connector (docs/mcp.md): an MCP server over the Hubra API, at
# mcp.hubra.club (ingress.yaml). It has no database access, no Secret and no
# credentials of its own: every call carries the caller's own API token to
# the backends below, which run all their usual checks.
#
# It calls the backends inside the cluster and passes Traefik's
# X-Forwarded-For along (MCP_FORWARDED=pass), so a token's IP allowlist and
# last-used address see the person, not this pod; the backends read it with
# their own PROXY_FIX_X_FOR, as for a request through the ingress.
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  # Stateless (no MCP sessions are kept), so any replica answers any call.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mcp
          image: hubra/mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: HUBRA_API_URL, value: "http://backend:5000" }
            - { name: HUBRA_PLATFORM_API_URL, value: "http://platform-backend:5000" }
            # The Host header must be one of these (DNS rebinding guard).
            - { name: MCP_ALLOWED_HOSTS, value: "mcp.hubra.club" }
            # Behind the same Traefik as the API: pass its X-Forwarded-For on.
            - { name: MCP_FORWARDED, value: pass }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
