# Every pod in the namespace pulls private images with this secret, so no
# manifest has to repeat imagePullSecrets. The secret itself is created by
# deploy/create-secrets.sh (GitHub token with read:packages).
# Pods get no token for the Kubernetes API; only the platform worker has
# one, through its own account (domains-rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
