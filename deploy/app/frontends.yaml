# Static SPAs served by nginx (production target of each app/*/Dockerfile).
# VITE_API_BASE is baked in at image build time, so these images are built per
# environment (see the frontend jobs in .gitlab-ci.yml).
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: nginx
          image: club/frontend
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            limits: { cpu: 500m, memory: 256Mi }
