# Static SPAs served by nginx (production target of each app/*/Dockerfile).
# Host names come from the hubra-frontend ConfigMap at container start
# (kustomization.yaml), so the same images serve any install.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: hubra/frontend
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: hubra-frontend
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            limits: { cpu: 500m, memory: 256Mi }
---
