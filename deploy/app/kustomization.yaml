# App stack: the k3s equivalent of docker-compose.yml + docker-compose.override.yaml.
# Flux applies this directory (deploy/flux/app.yaml). By hand:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/app | kubectl apply -f -
#
# Secrets are not in git: Secret `club-env` (from .env) and `gitlab-registry`
# are created once with deploy/create-secrets.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: club

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontends.yaml
  - ingress.yaml

# settings.yaml from the repo root; a change rolls the backend pods.
configMapGenerator:
  - name: club-settings
    files:
      - settings.yaml=../../settings.yaml

# Images pushed by GitLab CI. Set newName to your $CI_REGISTRY_IMAGE and pin
# newTag to a commit SHA to deploy a specific build.
images:
  - name: club/backend
    newName: registry.gitlab.com/CHANGE-ME/club-operations-suite/backend
    newTag: latest
  - name: club/frontend
    newName: registry.gitlab.com/CHANGE-ME/club-operations-suite/frontend
    newTag: latest
  - name: club/admin-frontend
    newName: registry.gitlab.com/CHANGE-ME/club-operations-suite/admin-frontend
    newTag: latest
  - name: club/sso-frontend
    newName: registry.gitlab.com/CHANGE-ME/club-operations-suite/sso-frontend
    newTag: latest
