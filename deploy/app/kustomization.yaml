# App stack: the k3s equivalent of docker-compose.yml + docker-compose.override.yaml.
# Apply it with your own GitOps tool (Flux, Argo CD) or by hand:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/app | kubectl apply -f -
#
# Secrets are not in git: Secret `hubra-env` (from .env) and `ghcr-pull` are
# created once with deploy/create-secrets.sh. Host names: ingress.yaml and the
# hubra-frontend ConfigMap below (deploy/vollbuild-ch keeps the old vollbuild.ch
# hosts).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hubra

# Added to every object, not to selectors, so existing Deployments stay valid.
labels:
  - pairs:
      app.kubernetes.io/part-of: hubra
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - global-backend.yaml
  - platform-backend.yaml
  - frontends.yaml
  - mcp.yaml
  - ingress.yaml

# settings.yaml from the repo root; a change rolls the backend pods.
configMapGenerator:
  - name: hubra-settings
    files:
      - settings.yaml=../../settings.yaml

# Runtime settings of the SPA images (app/deploy/nginx/40-hubra-runtime.sh).
# Keep the host names in step with ingress.yaml.
  - name: hubra-frontend
    literals:
      - VITE_API_BASE=https://api.hubra.club/api
      - VITE_SSO_URL=https://sso.hubra.club
      - VITE_COS_URL=https://app.hubra.club
      - VITE_TENANT_APP_URL=https://app.hubra.club
      - VITE_MANAGE_URL=https://manage.hubra.club
      - VITE_ADMIN_PORTAL_URL=https://manage.hubra.club
      - VITE_SUPPORT_URL=https://support.hubra.club
      # k3s pod network: trust X-Forwarded-For from Traefik.
      - REAL_IP_FROM=10.42.0.0/16

# Images built by .github/workflows/images.yml. `latest` is the newest build
# (release or manual run on main); pin newTag to a release (1.2.3), or add the
# digest from the Images run summary, to stay on one version.
images:
  - name: hubra/backend
    newName: ghcr.io/hubra-app/hubra/backend
    newTag: latest
  # The same build as backend under their own names (docs/platform-backend.md):
  # pin each separately to roll it without the others.
  - name: hubra/global-backend
    newName: ghcr.io/hubra-app/hubra/global-backend
    newTag: latest
  - name: hubra/platform-backend
    newName: ghcr.io/hubra-app/hubra/platform-backend
    newTag: latest
  - name: hubra/frontend
    newName: ghcr.io/hubra-app/hubra/frontend
    newTag: latest
  - name: hubra/admin-frontend
    newName: ghcr.io/hubra-app/hubra/admin-frontend
    newTag: latest
  - name: hubra/sso-frontend
    newName: ghcr.io/hubra-app/hubra/sso-frontend
    newTag: latest
  - name: hubra/support-frontend
    newName: ghcr.io/hubra-app/hubra/support-frontend
    newTag: latest
  - name: hubra/mcp
    newName: ghcr.io/hubra-app/hubra/mcp
    newTag: latest
