# Replaces the four host names of deploy/app/ingress.yaml with one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubra
spec:
  tls:
    - secretName: hubra-tls
      hosts:
        - club.example.org
  rules:
    - host: club.example.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
