# Single-club install on k3s: deploy/app without the manager and SSO portals,
# on one host name (docs/single-club.md). Deploy it instead of deploy/app.
# By hand:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/single-club | kubectl apply -f -
#
# Before the first start, set in .env and re-run deploy/create-secrets.sh:
#   SINGLE_CLUB=<slug>  CLUB_NAME=<name>  ADMIN_EMAIL=<first admin>
#   FRONTEND_BASE_URL=https://<host>  CORS_ORIGINS=https://<host>
#   JWT_COOKIE_DOMAIN=   (empty: the app and the API share the host)
# Then replace club.example.org below and in ingress.yaml with that host.
# Without ADMIN_PASSWORD the one-time password is in the init log:
#   kubectl -n hubra logs deploy/backend -c flask-init
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../app

patches:
  # One ingress host: /api to the backend, everything else to the club app.
  - path: ingress.yaml
  # The init container also creates the club and its first admin (a no-op
  # once the club exists).
  - path: backend-init.yaml
  # No manager portal and no SSO portal.
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: admin-frontend
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: admin-frontend
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sso-frontend
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: sso-frontend

configMapGenerator:
  - name: hubra-frontend
    behavior: merge
    literals:
      # Same origin: the club app calls /api on its own host.
      - VITE_API_BASE=/api
      - VITE_COS_URL=https://club.example.org
      - VITE_TENANT_APP_URL=https://club.example.org
