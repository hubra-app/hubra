# Let's Encrypt issuer for the app hosts (api/app/manage/sso.hubra.club).
# Applied after cert-manager is ready (Flux Kustomization infra-config).
# Replaces the `letencrypt` certresolver of the old external Traefik.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mikekeller98@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
