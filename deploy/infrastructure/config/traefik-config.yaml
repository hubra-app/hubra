# Tunes the Traefik that k3s ships (kube-system).
# - externalTrafficPolicy: Local keeps the real client IP. wsgi.py trusts
#   exactly one X-Forwarded-For hop (ProxyFix x_for=1), which is this Traefik.
# - HTTP -> HTTPS redirect on the web entrypoint (the old external Traefik did
#   this for us).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
