# hubra.club host names on the cluster's public Traefik and issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubra
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik-public
  tls:
    - secretName: hubra-tls
      hosts:
        - api.hubra.club
        - app.hubra.club
        - manage.hubra.club
        - sso.hubra.club
    # Own certificate, so join can't hold up the others.
    - secretName: hubra-join-tls
      hosts:
        - join.hubra.club
  rules:
    - host: api.hubra.club
      http:
        paths:
          # The platform API goes to the platform backend (docs/platform-backend.md):
          # /api/v1/platform, plus the old /manager and /system paths, which the
          # backend rewrites (hubra.core.api_areas). Parts of the old /system are
          # the person's own (club directory, invites, requests): club backend.
          # The longest matching path wins.
          - path: /api/v1/platform
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          - path: /api/v1/manager
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          - path: /api/v1/system
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          - path: /api/v1/system/clubs
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /api/v1/system/invites
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /api/v1/system/join-requests
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /api/v1/system/tenant-requests/mine
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /api/v1/system/impersonation
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /api/v1/system/permissions
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
    - host: app.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
    - host: manage.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: admin-frontend, port: { name: http } }
    - host: sso.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sso-frontend, port: { name: http } }
    # Start a club, find one and ask to join: the SSO frontend again.
    - host: join.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sso-frontend, port: { name: http } }
