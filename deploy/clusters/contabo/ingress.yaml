# hubra.club host names on the cluster's public Traefik and issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubra
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik-public
  tls:
    - secretName: hubra-tls
      hosts:
        - api.hubra.club
        - app.hubra.club
        - manage.hubra.club
        - sso.hubra.club
    # Own certificate, so join can't hold up the others.
    - secretName: hubra-join-tls
      hosts:
        - join.hubra.club
    # The Claude connector (mcp.yaml, docs/mcp.md), also on its own
    # certificate: no DNS record for it yet must not hold up the others.
    - secretName: hubra-mcp-tls
      hosts:
        - mcp.hubra.club
    # The support site, on its own certificate as well.
    - secretName: hubra-support-tls
      hosts:
        - support.hubra.club
  rules:
    - host: api.hubra.club
      http:
        paths:
          # One backend per API area (docs/platform-backend.md, hubra.core.api_areas):
          # /api/v1/platform -> platform-backend, /api/v1/global -> global-backend,
          # everything else (/api/v1/app, plugin routes) -> backend. The old paths
          # (before the split) go where the backend rewrites them to. The longest
          # matching path wins. tests/test_api_areas.py checks this list.
          # Platform
          - path: /api/v1/platform
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          - path: /api/v1/manager/platform
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          - path: /api/v1/manager/plugins
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          - path: /api/v1/manager/support
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          - path: /api/v1/system
            pathType: Prefix
            backend:
              service: { name: platform-backend, port: { name: http } }
          # Global: sign-in, account, public data
          - path: /api/v1/global
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/system/clubs
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/system/invites
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/system/join-requests
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/system/tenant-requests/mine
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/system/impersonation
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/account
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/i18n
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/version
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/instance
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/maintenance
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/status
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/public
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/roadmap
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/support
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/apps
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          - path: /api/v1/plugins
            pathType: Prefix
            backend:
              service: { name: global-backend, port: { name: http } }
          # Club app: its permission catalogue, under the old /system
          - path: /api/v1/system/permissions
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          # The club app
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
    - host: app.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
    - host: manage.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: admin-frontend, port: { name: http } }
    - host: sso.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sso-frontend, port: { name: http } }
    # Start a club, find one and ask to join: the SSO frontend again.
    - host: join.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sso-frontend, port: { name: http } }
    # The Claude connector: only /mcp and /healthz answer.
    - host: mcp.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: mcp, port: { name: http } }
    # Help, roadmap, status and reports: its own pods, up during upgrades.
    - host: support.hubra.club
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: support-frontend, port: { name: http } }
