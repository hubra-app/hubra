# The official plugin marketplace at plugins.hubra.club: static nginx with the
# signed index.json and plugin archives, built by .github/workflows/plugins.yml.
# Every Hubra fetches https://plugins.hubra.club/index.json (keys/official/index.url).
apiVersion: v1
kind: Service
metadata:
  name: plugins
spec:
  selector:
    app.kubernetes.io/name: plugins
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugins
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plugins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plugins
    spec:
      containers:
        - name: nginx
          image: ghcr.io/hubra-app/hubra/plugins
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            limits: { cpu: 200m, memory: 64Mi }
