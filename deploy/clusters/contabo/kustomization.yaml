# Mike's Contabo k3s cluster (hubra.club), behind Cloudflare (docs/k3s.md,
# "The Contabo overlay"). The cluster's own GitOps repo syncs this path.
#
# The cluster brings its own Traefik (class traefik-public), cert-manager
# (ClusterIssuer letsencrypt-prod), Longhorn and the CloudNativePG operator.
#
# .env for this cluster (then POSTGRES_HOST=postgres-rw deploy/create-secrets.sh):
#   FRONTEND_BASE_URL=https://app.hubra.club
#   MANAGE_BASE_URL=https://manage.hubra.club
#   SSO_BASE_URL=https://sso.hubra.club
#   CORS_ORIGINS=https://app.hubra.club,https://manage.hubra.club,https://sso.hubra.club,https://join.hubra.club
#   JWT_COOKIE_DOMAIN=.hubra.club
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hubra

resources:
  - ../../app
  - postgres.yaml

patches:
  - path: ingress.yaml
  - path: resources.yaml
  # Cloudflare -> Traefik -> backend is two X-Forwarded-For hops. Only right
  # once traefik-public trusts the Cloudflare ranges (forwardedHeaders.trustedIPs).
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PROXY_FIX_X_FOR, value: "2" }
    target: { kind: Deployment, name: "backend|platform-backend" }
  # Postgres is the CloudNativePG cluster in postgres.yaml instead.
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  # Longhorn instead of local-path, so the data follows the pod to another node.
  - patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: longhorn
    target: { kind: StatefulSet, name: redis }
  - patch: |
      - op: add
        path: /spec/storageClassName
        value: longhorn
    target: { kind: PersistentVolumeClaim, name: celerybeat }
  # Prefer the core nodes; the edge nodes run ingress.
  - patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - { key: node-role.kubernetes.io/core, operator: Exists }
    target: { kind: "Deployment|StatefulSet" }

configMapGenerator:
  - name: hubra-frontend
    behavior: merge
    literals:
      - VITE_API_BASE=https://api.hubra.club/api
      - VITE_SSO_URL=https://sso.hubra.club
      - VITE_COS_URL=https://app.hubra.club
      - VITE_TENANT_APP_URL=https://app.hubra.club
      - VITE_MANAGE_URL=https://manage.hubra.club
      - VITE_ADMIN_PORTAL_URL=https://manage.hubra.club

# Pinned images, never `latest`: Flux only rolls out what this file names.
# To upgrade, paste the "Images pinned by digest" block from the Images run
# summary (or the GitLab Release notes) over this one. Pin by digest: Images
# reuses unchanged images under the new tag, and with a digest Kubernetes
# keeps their pods running instead of restarting every pod on each upgrade.
# A bare newTag (1.2.3, sha-<commit>) also works but restarts everything.
# The names are what ../../app already renamed the images to.
images:
  - name: ghcr.io/hubra-app/hubra/backend
    newTag: sha-66d4e53
  # Platform API, platform worker, beat and the init step (migrations). Same
  # build as backend; keep it at the backend's version or newer. A platform-
  # only fix: bump just this line, and the club pods don't restart.
  # (docs/platform-backend.md)
  - name: ghcr.io/hubra-app/hubra/platform-backend
    newTag: sha-66d4e53
  - name: ghcr.io/hubra-app/hubra/frontend
    newTag: sha-66d4e53
  - name: ghcr.io/hubra-app/hubra/admin-frontend
    newTag: sha-66d4e53
  - name: ghcr.io/hubra-app/hubra/sso-frontend
    newTag: sha-66d4e53
