# The opt-in mail module (modules/mail/k8s). Off by default: set
# `suspend: false` and push to turn it on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mail
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: app
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/mail/k8s
  prune: true
  timeout: 5m
