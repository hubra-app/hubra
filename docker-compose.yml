x-backend-app: &backend-app
  build:
    context: ./app/backend
  env_file: .env
  environment:
    - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
  security_opt:
    - no-new-privileges:true
  networks:
    - internal

services:
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  admin-frontend:
    build:
      context: .
      dockerfile: app/admin-frontend/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  sso-frontend:
    build:
      context: .
      dockerfile: app/sso-frontend/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  backend:
    <<: *backend-app
    restart: unless-stopped
    expose:
      - "5000"
    depends_on:
      flask-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  flask-init:
    <<: *backend-app
    restart: "no"
    command: >
      sh -c "flask db upgrade && flask sync-permissions && flask seed --skip-migrate"
    depends_on:
      postgres:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  celery-worker:
    <<: *backend-app
    restart: unless-stopped
    command: celery -A vollbuild.tasks.celery_app worker --loglevel=info
    depends_on:
      flask-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "ps aux | grep -v grep | grep 'celery.*worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  celery-beat:
    <<: *backend-app
    restart: unless-stopped
    command: celery -A vollbuild.tasks.celery_app beat --loglevel=info --schedule /celerybeat/celerybeat-schedule
    volumes:
      - celerybeat_data:/celerybeat
    depends_on:
      flask-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "ps aux | grep -v grep | grep 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  edge:
  internal:

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  celerybeat_data:
