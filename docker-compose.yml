# Hubra: app stack.
#
#   cp .env.example .env    # then fill in the secrets (see docs/run-with-docker.md)
#   docker compose pull     # prebuilt images from GHCR, or: docker compose build
#   docker compose up -d
#
# Out of the box this publishes three ports on 127.0.0.1:
#   8080  club app       (frontend)
#   8081  manager portal (admin-frontend)
#   8082  login / SSO    (sso-frontend)
# Each frontend proxies /api/ to the backend, so every app talks to the API on
# its own origin. Behind a reverse proxy with real host names, add
# docker-compose.traefik.yml (see that file) or point your own proxy at the
# published ports.
#
# Optional mail stack: add -f modules/mail/docker-compose.mail.yml.

x-backend-app: &backend-app
  image: ${HUBRA_IMAGE_PREFIX:-ghcr.io/hubra-app/hubra}/backend:${HUBRA_VERSION:-latest}
  build:
    context: .
    dockerfile: app/backend/Dockerfile
  env_file: .env
  environment:
    - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
  security_opt:
    - no-new-privileges:true
  networks:
    - internal

# Runtime settings for the three SPA images (app/deploy/nginx/40-hubra-runtime.sh).
# Defaults fit the local ports above; set the URLs in .env for real host names.
x-frontend-env: &frontend-env
  API_UPSTREAM: http://backend:5000
  VITE_API_BASE: ${VITE_API_BASE:-/api}
  VITE_SSO_URL: ${SSO_BASE_URL:-http://localhost:8082}
  VITE_COS_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  VITE_TENANT_APP_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  VITE_MANAGE_URL: ${MANAGE_BASE_URL:-http://localhost:8081}
  VITE_ADMIN_PORTAL_URL: ${MANAGE_BASE_URL:-http://localhost:8081}
  REAL_IP_FROM: ${REAL_IP_FROM:-}
  CSP: ${CSP:-}

services:
  frontend:
    image: ${HUBRA_IMAGE_PREFIX:-ghcr.io/hubra-app/hubra}/frontend:${HUBRA_VERSION:-latest}
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      target: production
    restart: unless-stopped
    environment: *frontend-env
    ports:
      - "${HUBRA_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  admin-frontend:
    image: ${HUBRA_IMAGE_PREFIX:-ghcr.io/hubra-app/hubra}/admin-frontend:${HUBRA_VERSION:-latest}
    build:
      context: .
      dockerfile: app/admin-frontend/Dockerfile
      target: production
    restart: unless-stopped
    environment: *frontend-env
    ports:
      - "${HUBRA_BIND:-127.0.0.1}:${ADMIN_FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  sso-frontend:
    image: ${HUBRA_IMAGE_PREFIX:-ghcr.io/hubra-app/hubra}/sso-frontend:${HUBRA_VERSION:-latest}
    build:
      context: .
      dockerfile: app/sso-frontend/Dockerfile
      target: production
    restart: unless-stopped
    environment: *frontend-env
    ports:
      - "${HUBRA_BIND:-127.0.0.1}:${SSO_FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  backend:
    <<: *backend-app
    restart: unless-stopped
    expose:
      - "5000"
    depends_on:
      flask-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  flask-init:
    <<: *backend-app
    restart: "no"
    command: >
      sh -c "flask db upgrade && flask sync-permissions && flask seed --skip-migrate && flask ensure-superadmins && flask plugins sync"
    depends_on:
      postgres:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  celery-worker:
    <<: *backend-app
    restart: unless-stopped
    command: celery -A hubra.core.tasks.celery_app worker --loglevel=info
    depends_on:
      flask-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      # The image has no ps: look at the main process directly.
      test:
        ["CMD", "python", "-c", "import sys; sys.exit(b'worker' not in open('/proc/1/cmdline', 'rb').read())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  celery-beat:
    <<: *backend-app
    restart: unless-stopped
    command: celery -A hubra.core.tasks.celery_app beat --loglevel=info --schedule /celerybeat/celerybeat-schedule
    volumes:
      - celerybeat_data:/celerybeat
    depends_on:
      flask-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      # The image has no ps: look at the main process directly.
      test:
        ["CMD", "python", "-c", "import sys; sys.exit(b'beat' not in open('/proc/1/cmdline', 'rb').read())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  edge:
  internal:

volumes:
  pg_data:
  redis_data:
  celerybeat_data:
