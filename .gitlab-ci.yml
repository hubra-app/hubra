# GitLab CI: checks, release images and GitLab Releases.
#
# GitHub (hubra-app/hubra) is where the code lives; .github/workflows/mirror-gitlab.yml
# pushes main and the tags to the GitLab project, which runs this file:
#
#   main, merge requests   checks (the same as .github/workflows/ci.yml)
#   tag v1.2.3             checks, then the seven images go to the GitLab
#                          Container Registry, then a GitLab Release with the
#                          changelog and the image digests
#
# Images: $CI_REGISTRY_IMAGE/<image>:1.2.3 (plus :1.2 and :1 for final
# releases). No `latest`: the cluster pins a version or a digest. Setup, CI
# variables and the cluster pull secret: docs/gitlab.md.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
    # GitHub already ran the same checks; set HUBRA_SKIP_MAIN_CHECKS=true to
    # save CI minutes on main.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $HUBRA_SKIP_MAIN_CHECKS != "true"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - build
  - release

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

# ── Checks ──────────────────────────────────────────────────────────────────

backend:
  stage: check
  image: python:3.13-slim-bookworm
  cache:
    key:
      files: [app/backend/requirements.lock]
    paths: [.cache/pip]
  script:
    - cd app/backend
    - pip install --no-deps -r requirements.lock
    - pip install pytest pytest-flask ruff==0.15.17
    - ruff check .
    # Tests run on in-memory SQLite (TestingConfig); no services needed.
    - pytest -q

frontends:
  stage: check
  image: node:22-bookworm-slim
  parallel:
    matrix:
      - APP: [frontend, admin-frontend, sso-frontend]
  cache:
    key: npm-$APP
    paths: [.cache/npm]
  script:
    - cd "app/$APP"
    - npm ci
    - npm run lint
    - npm run build
    - |
      if [ "$APP" = frontend ]; then
        npm run typecheck:plugins
        npm run build:plugin
      fi

compose:
  stage: check
  image: docker:27.5.1-cli
  script:
    - scripts/init-env.sh
    - docker compose config -q
    - docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
    - docker compose -f docker-compose.yml -f modules/mail/docker-compose.mail.yml config -q

kubernetes:
  stage: check
  image:
    name: alpine/k8s:1.31.4
    entrypoint: [""]
  script:
    - |
      set -e
      out=/tmp/rendered
      mkdir -p "$out"
      # Every overlay under deploy/ and the mail stack.
      for kfile in deploy/*/kustomization.yaml deploy/*/*/kustomization.yaml modules/mail/k8s/kustomization.yaml; do
        [ -f "$kfile" ] || continue
        dir="$(dirname "$kfile")"
        echo "kustomize $dir"
        kubectl kustomize --load-restrictor LoadRestrictionsNone "$dir" > "$out/$(echo "$dir" | tr / _).yaml"
      done
      # Plain manifests, where the repo still has them.
      extra=""
      for dir in deploy/infrastructure deploy/flux; do
        [ -d "$dir" ] && extra="$extra $dir"
      done
      # shellcheck disable=SC2086
      kubeconform -strict -summary -kubernetes-version 1.31.0 \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        "$out" $extra

shellcheck:
  stage: check
  image: koalaman/shellcheck-alpine:v0.10.0
  script:
    - shellcheck deploy/create-secrets.sh scripts/init-env.sh scripts/changelog.sh app/deploy/nginx/40-hubra-runtime.sh

# ── Release images (tags only) ──────────────────────────────────────────────

images:
  stage: build
  extends: .release
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  parallel:
    matrix:
      - { IMAGE: backend, CONTEXT: ., DOCKERFILE: app/backend/Dockerfile }
      - { IMAGE: frontend, CONTEXT: ., DOCKERFILE: app/frontend/Dockerfile, TARGET: production }
      - { IMAGE: admin-frontend, CONTEXT: ., DOCKERFILE: app/admin-frontend/Dockerfile, TARGET: production }
      - { IMAGE: sso-frontend, CONTEXT: ., DOCKERFILE: app/sso-frontend/Dockerfile, TARGET: production }
      - { IMAGE: haraka, CONTEXT: modules/mail/haraka, DOCKERFILE: modules/mail/haraka/Dockerfile }
      - { IMAGE: zonemta, CONTEXT: modules/mail/zonemta, DOCKERFILE: modules/mail/zonemta/Dockerfile }
      - { IMAGE: cert-watcher, CONTEXT: modules/mail/cert-watcher, DOCKERFILE: modules/mail/cert-watcher/Dockerfile }
  before_script:
    - apk add --no-cache jq
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container
  script:
    - |
      set -eu
      version="${CI_COMMIT_TAG#v}"
      repo="$CI_REGISTRY_IMAGE/$IMAGE"
      tags="--tag $repo:$version"
      # Final releases also move 1.2 and 1; pre-releases (1.2.3-rc.1) don't.
      case "$version" in
        *-*) ;;
        *) tags="$tags --tag $repo:${version%.*} --tag $repo:${version%%.*}" ;;
      esac
      target=""
      [ -n "${TARGET:-}" ] && target="--target $TARGET"
      # Add linux/arm64 for arm nodes (slower: builds under QEMU).
      # shellcheck disable=SC2086
      docker buildx build "$CONTEXT" \
        --file "$DOCKERFILE" $target \
        --platform linux/amd64 \
        $tags \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.version="$version" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --cache-from "type=registry,ref=$repo:buildcache" \
        --cache-to "type=registry,ref=$repo:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
        --metadata-file metadata.json \
        --push
      mkdir -p digests
      # "<repository> <digest>", read by release-notes.
      echo "$repo $(jq -r '."containerimage.digest"' metadata.json)" > "digests/$IMAGE"
      cat "digests/$IMAGE"
  artifacts:
    paths: [digests/]
    expire_in: 1 week

# ── GitLab Release ──────────────────────────────────────────────────────────

release-notes:
  stage: release
  extends: .release
  image: alpine:3.20
  needs: [images]
  variables:
    GIT_DEPTH: 0 # the changelog needs the previous tag
  script:
    - apk add --no-cache git
    - scripts/changelog.sh "$CI_COMMIT_TAG" > release-notes.md
    - |
      {
        echo
        echo "## Images"
        echo
        echo "Pinned by digest, for the images: block of an overlay such as"
        echo "deploy/clusters/contabo (deploy/app and modules/mail/k8s name them"
        echo "ghcr.io/hubra-app/hubra/<image>):"
        echo
        echo '```yaml'
        echo "images:"
        for image in backend frontend admin-frontend sso-frontend haraka zonemta cert-watcher; do
          read -r repo digest < "digests/$image"
          echo "  - name: ghcr.io/hubra-app/hubra/$image"
          echo "    newName: $repo # ${CI_COMMIT_TAG#v}"
          echo "    digest: $digest"
        done
        echo '```'
      } >> release-notes.md
    - cat release-notes.md
  artifacts:
    paths: [release-notes.md]

release:
  stage: release
  extends: .release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs: [release-notes]
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Hubra $CI_COMMIT_TAG
    description: release-notes.md
