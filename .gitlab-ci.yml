# ── GitLab CI ──────────────────────────────────────────────────────────────────
#
# Badge URLs (add in Settings → CI/CD → Badges):
#
#   Frontend build:
#     Link:   https://gitlab.example.com/%{project_path}/
#     Badge:  https://gitlab.example.com/%{project_path}/badges/%{default_branch}/pipeline.svg?job=frontend:build
#
#   Backend tests:
#     Link:   https://gitlab.example.com/%{project_path}/
#     Badge:  https://gitlab.example.com/%{project_path}/badges/%{default_branch}/pipeline.svg?job=backend:test
#
#   Mail config:
#     Link:   https://gitlab.example.com/%{project_path}/
#     Badge:  https://gitlab.example.com/%{project_path}/badges/%{default_branch}/pipeline.svg?job=mail:validate

# Only run pipelines on merge requests (pre-merge validation) and on master
# (post-merge confirmation / deploy trigger). Raw pushes to feature branches
# without an open MR produce no pipeline at all.
default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - test
  - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"
  NODE_OPTIONS: "--max-old-space-size=4096"

  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  DOCKER_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# ------------------------------------------------------------
# Mail validation
# ------------------------------------------------------------

mail:validate:
  stage: validate
  image: python:3.12-slim

  before_script:
    - apt-get update -qq
    - apt-get install -y -qq nodejs npm shellcheck
    - pip install --cache-dir $PIP_CACHE_DIR toml pyyaml

  script:
    - python3 modules/mail/scripts/validate-mail-config.py
    - shellcheck modules/mail/*/entrypoint.sh modules/mail/certbot/*.sh modules/mail/cert-watcher/*.sh
    - node --check modules/mail/zonemta/plugins/self-forward-rewrite.js
    - |
      for f in modules/mail/*/Dockerfile; do
        grep -q '^FROM' "$f" &&
          echo "OK $f" ||
          (echo "FAIL $f" && exit 1)
      done

  rules:
    - changes:
        - modules/mail/**/*

# ------------------------------------------------------------
# CI YAML validation
# ------------------------------------------------------------

ci:lint:
  stage: validate
  image: python:3.12-slim

  script:
    - pip install --cache-dir $PIP_CACHE_DIR pyyaml
    - python -c "import yaml; yaml.safe_load(open('.gitlab-ci.yml')); print('Valid')"

  rules:
    - changes:
        - .gitlab-ci.yml

# ------------------------------------------------------------
# Dockerfile lint
# ------------------------------------------------------------

hadolint:
  stage: validate
  image: hadolint/hadolint:latest-debian

  script:
    - find . -name Dockerfile -exec hadolint {} \;

  rules:
    - changes:
        - "**/Dockerfile*"
        - "**/.dockerignore"

# ------------------------------------------------------------
# k3s manifests
# ------------------------------------------------------------

k8s:validate:
  stage: validate
  image:
    name: alpine/k8s:1.31.4
    entrypoint: [""]

  # Same build flags as Flux; Flux CRDs are checked against the datree catalog.
  script:
    - |
      set -e
      kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/app > /tmp/app.yaml
      kubectl kustomize --load-restrictor LoadRestrictionsNone modules/mail/k8s > /tmp/mail.yaml
      kubeconform -strict -summary -kubernetes-version 1.31.0 \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        /tmp/app.yaml /tmp/mail.yaml deploy/infrastructure deploy/flux
    - command -v shellcheck >/dev/null || apk add --no-cache shellcheck
    - shellcheck deploy/create-secrets.sh

  rules:
    - changes:
        - deploy/**/*
        - modules/mail/k8s/**/*
        - settings.yaml

# ------------------------------------------------------------
# Frontend
# ------------------------------------------------------------

frontend:
  stage: test
  image: node:22-slim

  cache:
    key:
      files:
        - app/frontend/package-lock.json
    paths:
      - .cache/npm

  script:
    - cd app/frontend
    - npm ci --cache $NPM_CACHE_DIR --prefer-offline
    - npm run lint
    - npm run build

  rules:
    - changes:
        - app/frontend/**/*

# ------------------------------------------------------------
# Backend
# ------------------------------------------------------------

backend:
  stage: test
  image: python:3.12-slim

  services:
    - postgres:16-alpine
    - redis:7-alpine

  variables:
    FLASK_ENV: testing
    POSTGRES_DB: test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password

    DATABASE_URL: postgresql://postgres:password@postgres:5432/test
    REDIS_URL: redis://redis:6379/0

    JWT_SECRET_KEY: ci-test-secret

  cache:
    key:
      files:
        - app/backend/requirements.txt
    paths:
      - .cache/pip

  before_script:
    - pip install --cache-dir $PIP_CACHE_DIR -r app/backend/requirements.txt
    - pip install --cache-dir $PIP_CACHE_DIR ruff pytest

  script:
    - cd app/backend
    - ruff check .
    - pytest tests/ -v

  rules:
    - changes:
        - app/backend/**/*

# ------------------------------------------------------------
# Docker build template
# ------------------------------------------------------------

.docker-build:
  stage: docker
  image: docker:28-cli

  services:
    - docker:28-dind

  variables:
    DOCKER_DRIVER: overlay2

  resource_group: docker-build

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin

  script:
    - |
      docker pull "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest" || true

      # BUILD_ARGS is intentionally unquoted: it holds zero or more --build-arg flags.
      docker build \
        --cache-from "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest" \
        -f "${DOCKERFILE:-$CONTEXT/Dockerfile}" \
        ${DOCKER_TARGET:+--target "$DOCKER_TARGET"} \
        $BUILD_ARGS \
        -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$DOCKER_IMAGE_TAG" \
        "$CONTEXT"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag \
          "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$DOCKER_IMAGE_TAG" \
          "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest"
      fi

      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag \
          "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$DOCKER_IMAGE_TAG" \
          "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_TAG"
      fi

      docker push --all-tags "$CI_REGISTRY_IMAGE/$IMAGE_NAME"

  after_script:
    - docker logout $CI_REGISTRY

# ------------------------------------------------------------
# Frontend images (cos, manage, sso)
# ------------------------------------------------------------
# The Dockerfiles copy packages/api-client from the repo root, so the build
# context is the repo root (same as docker-compose.yml). VITE_API_BASE is baked
# into the bundle at build time; set it as a CI/CD variable
# (production: https://api.vollbuild.ch/api).

.frontend-docker:
  extends: .docker-build
  variables:
    CONTEXT: "."
    DOCKER_TARGET: production
    BUILD_ARGS: "--build-arg VITE_API_BASE=$VITE_API_BASE"

frontend:docker:
  extends: .frontend-docker
  variables:
    IMAGE_NAME: frontend
    DOCKERFILE: app/frontend/Dockerfile
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes:
        - app/frontend/**/*
        - packages/**/*

admin-frontend:docker:
  extends: .frontend-docker
  variables:
    IMAGE_NAME: admin-frontend
    DOCKERFILE: app/admin-frontend/Dockerfile
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes:
        - app/admin-frontend/**/*
        - packages/**/*

sso-frontend:docker:
  extends: .frontend-docker
  variables:
    IMAGE_NAME: sso-frontend
    DOCKERFILE: app/sso-frontend/Dockerfile
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes:
        - app/sso-frontend/**/*
        - packages/**/*

# ------------------------------------------------------------
# Backend image
# ------------------------------------------------------------

backend:docker:
  extends: .docker-build
  variables:
    IMAGE_NAME: backend
    CONTEXT: app/backend
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - app/backend/**/*
    - if: '$CI_COMMIT_TAG'
      changes:
        - app/backend/**/*

